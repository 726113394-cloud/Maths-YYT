<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学思维闯关 · 四年级上册</title>
<style>
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0;padding:0;min-height:100vh;color:#3a3355;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background-color:#FFFBF2;
  background-image:
    radial-gradient(circle at 10% 15%, #FFE9A8 0%, transparent 38%),
    radial-gradient(circle at 90% 12%, #B8E5FF 0%, transparent 35%),
    radial-gradient(circle at 82% 88%, #FFD4E7 0%, transparent 38%),
    radial-gradient(circle at 15% 88%, #C6F3D9 0%, transparent 35%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px;}

.hero{text-align:center;margin-bottom:16px;}
.hero .mascot{font-size:46px;line-height:1;margin-bottom:4px;
  display:inline-block;animation:bob 3s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg);}50%{transform:translateY(-9px) rotate(4deg);}}
.hero h1{font-size:27px;margin:0 0 7px;font-weight:900;letter-spacing:.8px;
  background:linear-gradient(120deg,#FF9F43 0%,#FF6B9D 45%,#7C5CFF 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{margin:0;font-size:13px;font-weight:700;color:#a79fc2;letter-spacing:.5px;}

.tab-nav{display:flex;gap:8px;margin-bottom:16px;padding:6px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);border-radius:18px;
  border:2.5px solid #FFE3A8;box-shadow:0 4px 0 #FFE3A8;}
.tab-btn{flex:1;padding:10px 12px;border:none;background:transparent;
  font-family:inherit;font-size:13.5px;font-weight:800;color:#8B7FD0;
  cursor:pointer;border-radius:12px;transition:.2s;letter-spacing:.3px;}
.tab-btn:hover{background:#F8F6FF;color:#6B4CE6;}
.tab-btn.active{background:linear-gradient(135deg,#8B6BFF,#6B4CE6);color:#fff;
  box-shadow:0 3px 0 #4E35C4;}
.tab-btn .badge{display:inline-block;min-width:19px;height:19px;
  padding:0 5px;margin-left:3px;background:#FF6B9D;color:#fff;
  font-size:11px;font-weight:900;border-radius:10px;line-height:19px;text-align:center;}
.tab-btn.active .badge{background:#fff;color:#6B4CE6;}

.score-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;
  margin-bottom:14px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:18px;border:2.5px solid #FFE3A8;
  box-shadow:0 4px 0 #FFE3A8,0 12px 28px rgba(255,200,100,.18);}
.score-item{display:flex;align-items:center;gap:5px;padding:6px 12px;
  border-radius:12px;background:linear-gradient(140deg,#FFFCF2,#FFF6E0);}
.score-icon{font-size:16px;line-height:1;}
.score-value{font-size:17px;font-weight:900;color:#D97706;
  min-width:18px;text-align:center;transition:color .2s;}
.score-label{font-size:11.5px;font-weight:800;color:#a79fc2;}
.score-actions{margin-left:auto;display:flex;gap:5px;}
.score-toggle{border:none;background:transparent;color:#8B7FD0;
  font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;
  padding:6px 10px;border-radius:10px;transition:.18s;}
.score-toggle:hover{background:#F6F2FF;color:#6B4CE6;}
.score-bar.collapsed .score-item{display:none;}
.score-bar.collapsed .score-actions{margin-left:0;}
.score-value.pulse{animation:scorePulse .55s ease;}
@keyframes scorePulse{
  0%{transform:scale(1);color:#D97706;}
  45%{transform:scale(1.55);color:#FF9F43;}
  100%{transform:scale(1);color:#D97706;}
}
.score-float{position:fixed;z-index:999;pointer-events:none;
  font-size:24px;font-weight:900;color:#FF9F43;
  transform:translate(-50%,0);will-change:transform,opacity;
  text-shadow:0 2px 6px rgba(255,150,50,.4);
  animation:floatUp 1.4s cubic-bezier(.34,1.2,.64,1) forwards;}
.score-float.bonus{font-size:28px;color:#FF6B9D;}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.5);}
  18%{opacity:1;transform:translate(-50%,-14px) scale(1.18);}
  35%{transform:translate(-50%,-22px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-80px) scale(1);}
}

/* 难度选择 */
.tool-bar{display:flex;align-items:center;gap:8px;padding:12px 14px;
  margin-bottom:14px;flex-wrap:wrap;background:#fff;border-radius:18px;
  box-shadow:0 4px 0 rgba(124,92,255,.06),0 10px 22px rgba(124,92,255,.08);}
.diff-filter{display:flex;gap:6px;flex-wrap:wrap;}
.diff-btn{padding:8px 12px;border:none;border-radius:10px;
  background:#F8F6FF;color:#8B7FD0;font-family:inherit;
  font-size:12.5px;font-weight:800;cursor:pointer;
  transition:transform .15s,background .15s,color .15s,box-shadow .15s;
  box-shadow:0 2px 0 #E4DDFF;line-height:1.35;text-align:left;}
.diff-btn:hover{background:#F1ECFF;color:#6B4CE6;transform:translateY(-1px);}
.diff-btn.active{background:linear-gradient(135deg,#8B6BFF,#6B4CE6);
  color:#fff;box-shadow:0 3px 0 #4E35C4;}
.diff-btn .diff-sub{display:block;font-size:10.5px;font-weight:700;
  opacity:.7;margin-top:1px;letter-spacing:.2px;}
.tool-actions{margin-left:auto;display:flex;gap:6px;}
.timer-btn,.sound-btn{padding:7px 12px;border:none;border-radius:10px;
  background:#F8F6FF;color:#8B7FD0;font-family:inherit;
  font-size:12.5px;font-weight:800;cursor:pointer;transition:.18s;
  box-shadow:0 2px 0 #E4DDFF;}
.timer-btn:hover,.sound-btn:hover{background:#F1ECFF;color:#6B4CE6;}
.timer-btn.on{background:linear-gradient(135deg,#FF6B9D,#E64A7C);
  color:#fff;box-shadow:0 3px 0 #B83060;}
.sound-btn.muted{opacity:.5;}

.timer-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;
  margin-bottom:14px;background:#fff;border-radius:16px;
  box-shadow:0 3px 0 rgba(255,150,150,.15);border:2px solid #FFD9AB;}
.timer-bar.urgent{border-color:#FF6B6B;animation:timerShake .5s ease;}
@keyframes timerShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}
.timer-track{flex:1;height:12px;background:#F1ECFF;border-radius:6px;overflow:hidden;}
.timer-progress{height:100%;width:100%;border-radius:6px;
  background:linear-gradient(90deg,#4EE08B,#2ED573);
  transition:width .95s linear,background .3s;will-change:width;}
.timer-bar.urgent .timer-progress{background:linear-gradient(90deg,#FF6B6B,#E63A3A);}
.timer-text{font-size:14px;font-weight:900;color:#8B7FD0;
  min-width:52px;text-align:right;}
.timer-bar.urgent .timer-text{color:#E63A3A;}

.card{background:#fff;border-radius:24px;
  box-shadow:0 5px 0 rgba(124,92,255,.07),0 16px 32px rgba(124,92,255,.11);}

.problem{padding:20px 22px 22px 26px;margin-bottom:16px;position:relative;overflow:hidden;}
.problem::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;
  background:linear-gradient(180deg,#FFB84D 0%,#FF7A9C 55%,#A78BFA 100%);}
.meta{display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:700;color:#a79fc2;margin-bottom:12px;
  gap:8px;flex-wrap:wrap;}
.meta .tag{background:linear-gradient(135deg,#FFE08A,#FFC24D);
  color:#8a5a00;padding:5px 13px;border-radius:20px;font-weight:800;
  font-size:11.5px;box-shadow:0 2px 0 #EBA92E;}
.meta .counter{margin-left:auto;}
.qtext{font-size:17.5px;line-height:1.95;color:#3a3355;font-weight:500;}
.qtext b{color:#5B3FD9;font-weight:800;
  background:linear-gradient(180deg,transparent 62%,#DDD4FF 62%,#DDD4FF 92%,transparent 92%);
  padding:0 2px;}

.facts{padding:18px 20px 20px;margin-bottom:22px;
  background:linear-gradient(140deg,#FFFCF2 0%,#F5FBFF 55%,#FBF6FF 100%);
  border:2.5px dashed #FFD98A;border-radius:24px;
  box-shadow:0 5px 0 rgba(255,200,100,.10),0 14px 28px rgba(255,180,80,.10);
  scroll-margin-top:18px;}
.facts.flash{animation:factsFlash 1.1s ease;}
@keyframes factsFlash{
  0%,100%{box-shadow:0 5px 0 rgba(255,200,100,.10),0 14px 28px rgba(255,180,80,.10);border-color:#FFD98A;}
  30%{box-shadow:0 0 0 7px rgba(255,200,100,.42);border-color:#FFB84D;}
}
.facts-head{display:flex;align-items:center;gap:8px;font-size:14.5px;
  font-weight:900;color:#4a4166;margin-bottom:5px;}
.facts-count{font-size:11.5px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#8B6BFF,#6B4CE6);
  padding:3px 10px;border-radius:20px;margin-left:auto;
  box-shadow:0 2px 0 #4E35C4;}
.facts-sub{font-size:12.5px;color:#a79fc2;margin-bottom:13px;padding-left:26px;font-weight:600;}
.facts-list{display:flex;flex-wrap:wrap;gap:10px;min-height:2px;}
.fact{display:flex;align-items:center;gap:9px;background:#fff;color:#4a4166;
  font-size:13.5px;font-weight:600;padding:9px 15px 9px 9px;
  border-radius:14px;line-height:1.5;border:2.5px solid #FFE3A8;
  box-shadow:0 3px 0 #FFE3A8;
  animation:factPop .42s cubic-bezier(.34,1.5,.64,1);}
.fact-no{flex:none;width:22px;height:22px;border-radius:8px;
  background:linear-gradient(135deg,#FFD86B,#FFA751);color:#fff;
  font-size:11.5px;font-weight:900;display:flex;align-items:center;
  justify-content:center;box-shadow:0 1.5px 0 #E8944A;}
.fact b{color:#D97706;font-weight:900;}
.fact.locked{background:#F6F4FC;border:2.5px dashed #D8D2EC;
  box-shadow:none;color:#B0A9C6;animation:none;}
.fact.locked .fact-no{background:#E4DFF3;color:#B0A9C6;box-shadow:none;}
.fact-hidden{font-style:normal;font-size:13px;}
.facts-empty{padding:14px 4px;font-size:13.5px;color:#a79fc2;
  text-align:center;line-height:1.8;width:100%;font-weight:600;}
@keyframes factPop{
  0%{opacity:0;transform:scale(.8) translateY(8px);}
  60%{opacity:1;transform:scale(1.05) translateY(-2px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}

.section-title{display:flex;align-items:center;gap:9px;font-size:14px;
  font-weight:800;color:#6b6385;margin:0 0 13px 6px;flex-wrap:wrap;}
.dot-mark{width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,#FFB84D,#FF7A9C);
  box-shadow:0 0 0 3px rgba(255,140,120,.18);flex:none;}
.spacer{flex:1;}
.mini-btn{border:none;background:#fff;color:#7C5CFF;font-size:12.5px;
  font-weight:800;cursor:pointer;font-family:inherit;padding:7px 13px;
  border-radius:12px;transition:transform .15s,box-shadow .15s,background .15s;
  box-shadow:0 3px 0 rgba(124,92,255,.13);}
.mini-btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 rgba(124,92,255,.18);background:#F8F6FF;}
.mini-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(124,92,255,.13);}
.mini-btn.primary{background:linear-gradient(135deg,#FFD86B,#FFA751);
  color:#8a5a00;box-shadow:0 3px 0 #E8944A;}

/* ============ 步骤卡 ============ */
.step{background:#fff;border-radius:20px;margin-bottom:12px;
  box-shadow:0 4px 0 rgba(124,92,255,.06),0 10px 22px rgba(124,92,255,.09);
  overflow:hidden;transition:box-shadow .25s,transform .2s;will-change:transform;}
.step.active{box-shadow:0 0 0 3px #A78BFA,0 12px 28px rgba(124,92,255,.22);}
.step.locked{opacity:.55;background:#FAF9FE;box-shadow:0 2px 0 rgba(124,92,255,.04);}
.step.done{background:linear-gradient(180deg,#FBFFFD,#F6FFFA);}

.step-head{display:flex;align-items:center;gap:12px;padding:16px 20px;}
.step.locked .step-head{padding:13px 20px;}
.step-num{flex:none;width:28px;height:28px;border-radius:10px;
  background:#EDE8FF;color:#7C5CFF;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 0 #D8CEFF;transition:background .2s,color .2s,transform .2s;}
.step.active .step-num{background:linear-gradient(135deg,#8B6BFF,#6B4CE6);
  color:#fff;box-shadow:0 3px 0 #4E35C4;}
.step.done .step-num{background:linear-gradient(135deg,#4EE08B,#2ED573);
  color:#fff;box-shadow:0 3px 0 #1FA85A;font-size:14px;}
.step.locked .step-num{background:#EDEBF5;color:#B0A9C6;
  box-shadow:0 2px 0 #E0DDF0;font-size:13px;}
.step-q{font-size:15px;font-weight:800;color:#4a4166;line-height:1.6;flex:1;}
.step.done .step-q{color:#6b6385;font-weight:700;font-size:14px;}
.step.locked .step-q{color:#B0A9C6;font-weight:600;font-size:13.5px;}

/* 已完成步骤：紧凑模式 */
.step.done{cursor:pointer;}
.step.done .step-head{
  padding:11px 20px;
  transition:background .2s;
}
.step.done .step-head:hover{background:rgba(78,224,139,.06);}
.step-compact-tag{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:900;color:#17914F;
  background:#E4FBEE;padding:3px 9px;border-radius:8px;
  flex:none;
}
.step-chevron{
  flex:none;color:#8B7FD0;font-size:13px;
  transition:transform .3s cubic-bezier(.34,1.2,.64,1);
  display:inline-block;
}
.step.done.expanded .step-chevron{transform:rotate(180deg);}

/* 折叠内容 */
.step-body-wrap{
  display:grid;
  grid-template-rows:0fr;
  transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1);
  will-change:grid-template-rows;
}
.step.done.expanded .step-body-wrap{grid-template-rows:1fr;}
.step-body-wrap > .step-body{
  overflow:hidden;
  padding:0 18px 0 60px;
}
.step.done.expanded .step-body-wrap > .step-body{
  padding:0 18px 18px 60px;
}
@media(max-width:520px){
  .step-body-wrap > .step-body,
  .step.done.expanded .step-body-wrap > .step-body{
    padding-left:16px;padding-right:16px;
  }
}

/* 活跃步骤的步骤体 */
.step.active .step-body{padding:0 18px 18px 60px;}
@media(max-width:520px){
  .step.active .step-body{padding:0 16px 16px 16px;}
}

.opts{margin-top:2px;}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 16px;margin-bottom:10px;border-radius:16px;cursor:pointer;
  background:#F8F6FF;border:2.5px solid #EDE8FF;box-shadow:0 3px 0 #E4DDFF;
  font-family:inherit;font-size:14.5px;font-weight:700;color:#4a4166;
  line-height:1.55;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;
  will-change:transform;}
.opt:last-child{margin-bottom:0;}
.opt:hover:not(:disabled){background:#F1ECFF;border-color:#C4B5FD;
  box-shadow:0 4px 0 #C4B5FD;transform:translateY(-2px);}
.opt:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #C4B5FD;}
.opt:disabled{cursor:default;}
.opt-key{flex:none;width:28px;height:28px;border-radius:10px;background:#fff;
  border:2px solid #DDD4FF;color:#8B7FD0;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center;transition:.18s;}
.opt:hover:not(:disabled) .opt-key{border-color:#A78BFA;color:#6B4CE6;}
.opt.wrong{background:#FFF6EC;border-color:#FFD9AB;box-shadow:0 3px 0 #FFD9AB;color:#b06a10;}
.opt.wrong .opt-key{background:#FFD9AB;border-color:#FFD9AB;color:#fff;}
.opt.wrong .opt-text{text-decoration:line-through;opacity:.65;}

.fb-inline{margin-top:12px;font-size:13.5px;line-height:1.85;
  padding:12px 16px;border-radius:14px;font-weight:700;
  animation:fadeUp .25s ease;}
.fb-inline.ok{background:#E4FBEE;color:#17914F;}
.fb-inline.no{background:#FFF3E0;color:#B26A00;}
.fb-inline.brief{background:#EEF6FF;color:#2B6CB0;}
.chosen-line{font-size:14px;color:#6b6385;margin-top:12px;margin-bottom:9px;font-weight:600;}
.chosen-line b{color:#17914F;font-weight:800;}
@keyframes fadeUp{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

.answer{margin-top:24px;padding:22px;transition:.3s;}
.answer.locked{background:#FAF9FE;box-shadow:0 3px 0 rgba(124,92,255,.05);}
.lock-msg{font-size:13.5px;color:#a79fc2;text-align:center;line-height:1.9;font-weight:700;}
.answer-hint{font-size:12.5px;color:#8B7FD0;font-weight:700;
  margin-bottom:12px;padding-left:2px;}
.answer-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.answer-label{font-size:15px;font-weight:800;color:#4a4166;}
#ansInput{width:120px;padding:12px 15px;font-size:17px;font-weight:800;
  border:2.5px solid #E4DDFF;border-radius:14px;outline:none;
  transition:border-color .2s,box-shadow .2s;font-family:inherit;
  color:#3a3355;background:#FBF9FF;text-align:center;}
#ansInput:focus{border-color:#A78BFA;background:#fff;
  box-shadow:0 0 0 5px rgba(167,139,250,.16);}
.unit{font-size:15px;color:#6b6385;font-weight:700;}
.btn{padding:12px 26px;border:none;border-radius:14px;font-size:15px;
  font-weight:800;cursor:pointer;font-family:inherit;
  transition:transform .18s,box-shadow .18s;letter-spacing:.5px;}
.btn-primary{background:linear-gradient(135deg,#8B6BFF,#6B4CE6);color:#fff;
  box-shadow:0 4px 0 #4E35C4,0 8px 18px rgba(107,76,230,.32);}
.btn-primary:hover{transform:translateY(-2px);
  box-shadow:0 6px 0 #4E35C4,0 10px 22px rgba(107,76,230,.4);}
.btn-primary:active{transform:translateY(2px);box-shadow:0 2px 0 #4E35C4;}

.feedback{margin-top:16px;font-size:14.5px;line-height:1.85;
  padding:14px 18px;border-radius:16px;display:none;font-weight:700;}
.feedback.show{display:block;animation:fadeUp .25s ease;}
.feedback.ok{background:#E4FBEE;color:#17914F;}
.feedback.no{background:#FFF3E0;color:#B26A00;}
.feedback.warn{background:#EEF6FF;color:#2B6CB0;}
.fb-sub{font-size:13px;opacity:.85;font-weight:600;}

.nav{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:28px;}
.nav-btn{width:44px;height:44px;border-radius:50%;border:none;background:#fff;
  box-shadow:0 4px 0 rgba(124,92,255,.10),0 8px 18px rgba(124,92,255,.14);
  cursor:pointer;font-size:18px;font-weight:900;font-family:inherit;
  color:#7C5CFF;transition:transform .18s,box-shadow .18s;line-height:1;
  display:flex;align-items:center;justify-content:center;}
.nav-btn:hover:not(:disabled){transform:translateY(-2px);
  box-shadow:0 6px 0 rgba(124,92,255,.12),0 10px 22px rgba(124,92,255,.2);}
.nav-btn:disabled{opacity:.35;cursor:default;}
.dots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.dot-i{width:11px;height:11px;border-radius:50%;background:#E4DDFF;
  transition:transform .25s,background .25s;cursor:pointer;
  box-shadow:inset 0 -1.5px 0 rgba(0,0,0,.06);}
.dot-i.done{background:linear-gradient(135deg,#4EE08B,#2ED573);box-shadow:0 0 0 3px #D6F5E3;}
.dot-i.active{background:linear-gradient(135deg,#8B6BFF,#6B4CE6);
  transform:scale(1.4);box-shadow:0 0 0 4px #EDE8FF;}

.back-to-facts{position:fixed;right:24px;bottom:24px;z-index:100;
  display:flex;align-items:center;gap:7px;padding:12px 18px 12px 14px;
  border:2.5px solid #C4B5FD;border-radius:999px;background:#fff;
  color:#6B4CE6;font-family:inherit;font-size:13.5px;font-weight:800;
  cursor:pointer;box-shadow:0 4px 0 #DDD4FF,0 12px 26px rgba(124,92,255,.20);
  opacity:0;transform:translateY(18px) scale(.9);pointer-events:none;
  transition:opacity .28s cubic-bezier(.34,1.3,.64,1),
             transform .28s cubic-bezier(.34,1.3,.64,1);will-change:transform,opacity;}
.back-to-facts.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
.back-to-facts:hover{background:#F6F2FF;transform:translateY(-2px) scale(1.03);}
@media(max-width:520px){
  .back-to-facts{right:14px;bottom:14px;padding:11px 16px 11px 12px;font-size:12.5px;}
}

.page-head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding:0 4px;gap:10px;}
.page-head h2{font-size:19px;margin:0;font-weight:900;color:#4a4166;}
.page-head .mini-btn{background:linear-gradient(135deg,#FFD86B,#FFA751);
  color:#8a5a00;box-shadow:0 3px 0 #E8944A;}

.empty-state{text-align:center;padding:50px 20px;color:#a79fc2;

/* =========================================================
   音效
   ========================================================= */
let audioCtx = null;
let soundEnabled = true;

function ensureAudio() {
  if (!soundEnabled) return false;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { soundEnabled = false; return false; }
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return true;
  } catch (e) { soundEnabled = false; return false; }
}

function playNote(freq, dur, type, vol, delay) {
  if (!ensureAudio()) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const now = audioCtx.currentTime + (delay || 0);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(vol || 0.15, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.start(now);
    osc.stop(now + dur + 0.05);
  } catch (e) {}
}

function trySave(k, v) {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
}
function fmtTime(ts) {
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* 确定性洗牌（同一 seed 结果一样，避免重渲染时选项顺序变化） */
function seededShuffle(arr, seed) {
  const a = arr.slice();
  let s = seed * 9301 + 49297;
  for (let i = a.length - 1; i > 0; i--) {
    s = (s * 9301 + 49297) % 233280;
    const j = Math.floor((s / 233280) * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================
   状态
   ========================================================= */
let score = 0, combo = 0, perfectCount = 0;
let scoreVisible = true;
let currentDiff = 1;
let currentTab = 'practice';
let timerEnabled = false;
const TIME_LIMIT = 90;
let timerRemaining = 0;
let timerInterval = null;

const instances = [];
let visibleInstances = [];
let current = 0;

let wrongBook = tryLoad('mathWrongBook', []);
let history = tryLoad('mathHistory', []);

const $ = id => document.getElementById(id);
const hl = t => String(t).replace(/(\d+(?:\.\d+)?)/g, '<b>$1</b>');
const LETTER = 'ABCD';

/* =========================================================
   初始化
   ========================================================= */
function makeState() {
  return {
    stepIdx: 0,
    chosen: [],
    tried: [],
    expanded: [],
    solved: false,
    hadWrong: false,
    timedOut: false,
    recorded: false,
    timeUsed: 0,
    wrongAnswerRecorded: false
  };
}

function initAll() {
  instances.length = 0;
  problemTemplates.forEach(tpl => {
    try {
      const problem = tpl.generate();
      const st = makeState();
      st.chosen = problem.steps.map(() => null);
      st.tried = problem.steps.map(() => []);
      st.expanded = problem.steps.map(() => false);
      instances.push({ template: tpl, problem, state: st });
    } catch (e) { console.error('生成失败', tpl.tag, e); }
  });
  visibleInstances = instances.slice();
  current = 0;
}

function resetInstanceState(inst) {
  const st = makeState();
  st.chosen = inst.problem.steps.map(() => null);
  st.tried = inst.problem.steps.map(() => []);
  st.expanded = inst.problem.steps.map(() => false);
  inst.state = st;
}

function regenerate(idx) {
  const inst = instances[idx];
  if (!inst) return;
  try {
    inst.problem = inst.template.generate();
    resetInstanceState(inst);
  } catch (e) { console.error(e); }
}

/* =========================================================
   分数
   ========================================================= */
function addScore(p, bonus) {
  if (!scoreVisible) return;
  score += p;
  const el = $('scoreValue');
  if (el) {
    el.textContent = score;
    el.classList.remove('pulse');
    void el.offsetWidth;
    el.classList.add('pulse');
  }
  floatScore('+' + p, bonus);
}
function resetCombo() {
  combo = 0;
  const el = $('comboValue'); if (el) el.textContent = combo;
}
function incCombo() {
  combo += 1;
  const el = $('comboValue');
  if (el) {
    el.textContent = combo;
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  }
}
function incPerfect() {
  perfectCount += 1;
  const el = $('perfectValue');
  if (el) {
    el.textContent = perfectCount;
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  }
}
function floatScore(text, bonus) {
  const t = $('scoreValue'); if (!t) return;
  const r = t.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'score-float' + (bonus ? ' bonus' : '');
  el.textContent = text;
  el.style.left = (r.left + r.width / 2) + 'px';
  el.style.top = (r.top - 4) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

/* =========================================================
   计时
   ========================================================= */
function startTimer() {
  stopTimer();
  if (!timerEnabled || currentTab !== 'practice') {
    const b = $('timerBar'); if (b) b.style.display = 'none';
    return;
  }
  const inst = visibleInstances[current];
  if (!inst || inst.state.solved) {
    const b = $('timerBar'); if (b) b.style.display = 'none';
    return;
  }
  const bar = $('timerBar');
  bar.style.display = 'flex';
  timerRemaining = TIME_LIMIT;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) {
      clearInterval(timerInterval); timerInterval = null;
      handleTimeout();
    }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay() {
  const bar = $('timerBar'), prog = $('timerProgress'), txt = $('timerText');
  if (!bar || bar.style.display === 'none') return;
  prog.style.width = Math.max(0, timerRemaining / TIME_LIMIT * 100) + '%';
  txt.textContent = timerRemaining + 's';
  bar.classList.toggle('urgent', timerRemaining <= 15);
}
function handleTimeout() {
  const inst = visibleInstances[current];
  if (!inst || inst.state.solved) return;
  const st = inst.state;
  st.timedOut = true; st.solved = true; st.timeUsed = TIME_LIMIT;
  SFX.timeout();
  addWrongRecord(inst, {
    stepIdx: st.stepIdx + 1,
    stepQ: '超时未完成',
    wrongChoice: '（超时）',
    correctChoice: '正确答案 ' + inst.problem.answer + ' ' + inst.problem.unit
  });
  addHistoryRecord(inst, 0, false, TIME_LIMIT);
  render();
  renderWrongBadge();
}

/* =========================================================
   错题/历史记录
   ========================================================= */
function addWrongRecord(inst, info) {
  const p = inst.problem;
  wrongBook.unshift({
    id: uid(),
    qtext: p.text, qtag: p.tag, difficulty: currentDiff,
    wrongStep: info.stepIdx, wrongStepQ: info.stepQ,
    wrongChoice: info.wrongChoice, correctChoice: info.correctChoice,
    correctAnswer: p.answer, unit: p.unit,
    timestamp: Date.now()
  });
  if (wrongBook.length > 60) wrongBook = wrongBook.slice(0, 60);
  trySave('mathWrongBook', wrongBook);
  renderWrongBadge();
}
function addHistoryRecord(inst, pts, perfect, timeUsed) {
  const p = inst.problem;
  history.unshift({
    id: uid(),
    qtext: p.text.slice(0, 42) + (p.text.length > 42 ? '…' : ''),
    qtag: p.tag, difficulty: currentDiff,
    score: pts, perfect, timeUsed,
    timestamp: Date.now()
  });
  if (history.length > 80) history = history.slice(0, 80);
  trySave('mathHistory', history);
}

/* =========================================================
   题目渲染
   ========================================================= */
function render() {
  if (visibleInstances.length === 0) return;
  if (current >= visibleInstances.length) current = visibleInstances.length - 1;
  if (current < 0) current = 0;
  const inst = visibleInstances[current];
  if (!inst) return;
  const p = inst.problem;

  $('tag').textContent = p.tag;
  $('counter').textContent = `第 ${current + 1} / ${visibleInstances.length} 题`;
  $('qtext').innerHTML = hl(p.text);

  renderFacts();
  renderSteps();
  renderAnswer();
  renderDots();
  $('prevBtn').disabled = current === 0;
  $('nextBtn').disabled = current === visibleInstances.length - 1;
  updateBackBtn();
  startTimer();
}

function renderFacts() {
  const inst = visibleInstances[current];
  if (!inst) return;
  const p = inst.problem, st = inst.state;
  const cfg = DIFF_CONFIG[currentDiff];
  const revealed = new Set();

  if (cfg.revealAll) {
    p.facts.forEach((_, i) => revealed.add(i));
  } else {
    p.steps.forEach((s, i) => {
      if (st.stepIdx > i && s.reveals && s.reveals.length) {
        s.reveals.forEach(f => revealed.add(f));
      }
    });
  }

  const list = $('factsList');
  const countEl = $('factsCount');
  const subEl = $('factsSub');

  if (revealed.size === 0) {
    countEl.style.display = 'none';
    subEl.textContent = '完成思考步骤，条件会逐步出现';
    list.innerHTML = `<div class="facts-empty">还没有找到已知条件<br>先完成下面的思考步骤吧 👇</div>`;
    return;
  }

  countEl.style.display = 'inline-block';
  countEl.textContent = `${revealed.size} / ${p.facts.length}`;
  subEl.textContent = revealed.size === p.facts.length
    ? (cfg.revealAll ? '挑战模式：条件已全部给出，自己梳理思路吧' : '条件已全部找到，可以开始整理思路了')
    : '已经找到部分条件，继续往下想';

  list.innerHTML = p.facts.map((f, i) => {
    if (revealed.has(i)) {
      return `<div class="fact"><span class="fact-no">${i + 1}</span><span>${hl(f)}</span></div>`;
    }
    return `<div class="fact locked"><span class="fact-no">?</span><span class="fact-hidden">待解锁的条件</span></div>`;
  }).join('');
}

/* =========================================================
   步骤渲染 —— 关键：难度决定选项数量、折叠状态
   ========================================================= */
function renderSteps() {
  const inst = visibleInstances[current];
  if (!inst) return;
  const p = inst.problem, st = inst.state;
  const cfg = DIFF_CONFIG[currentDiff];
  const wrap = $('steps');
  wrap.innerHTML = '';

  p.steps.forEach((s, i) => {
    const el = document.createElement('div');
    el.dataset.step = i;

    if (i < st.stepIdx) {
      // 已完成：折叠/展开
      const isExpanded = !!st.expanded[i];
      el.className = 'step done' + (isExpanded ? ' expanded' : '');
      const pick = st.chosen[i];
      const pickText = (pick !== null && pick !== undefined) ? s.options[pick] : '—';
      const fbClass = cfg.detail === 'full' ? 'ok' : 'brief';
      const fbText = cfg.detail === 'full' ? s.correct : '答对啦！继续下一步。';
      el.innerHTML = `
        <div class="step-head">
          <span class="step-num">✓</span>
          <span class="step-q">第 ${i + 1} 步 · ${s.q}</span>
          <span class="step-chevron">▾</span>
        </div>
        <div class="step-body-wrap">
          <div class="step-body">
            <div class="chosen-line">你的选择：<b>${pick !== null ? LETTER[pick] + '. ' + pickText : '—'}</b></div>
            <div class="fb-inline ${fbClass}">✔ ${fbText}</div>
          </div>
        </div>`;
      el.querySelector('.step-head').addEventListener('click', () => {
        st.expanded[i] = !st.expanded[i];
        el.classList.toggle('expanded', st.expanded[i]);
        SFX.click();
      });
    } else if (i === st.stepIdx && !st.solved) {
      // 当前步骤
      el.className = 'step active';
      const visibleOpts = buildVisibleOptions(s, cfg.options, i + current * 100);
      const optsHtml = visibleOpts.map((vo, dispIdx) => {
        const isWrong = st.tried[i].includes(vo.original);
        return `<button class="opt${isWrong ? ' wrong' : ''}"
                  data-step="${i}" data-orig="${vo.original}"
                  ${isWrong ? 'disabled' : ''}>
                  <span class="opt-key">${LETTER[dispIdx]}</span>
                  <span class="opt-text">${vo.text}</span>
                </button>`;
      }).join('');
      const fb = st.tried[i].length
        ? `<div class="fb-inline no">✘ ${s.wrong}</div>` : '';
      el.innerHTML = `
        <div class="step-head">
          <span class="step-num">${i + 1}</span>
          <span class="step-q">${s.q}</span>
        </div>
        <div class="step-body">
          <div class="opts">${optsHtml}</div>
          ${fb}
        </div>`;
    } else {
      el.className = 'step locked';
      el.innerHTML = `
        <div class="step-head">
          <span class="step-num">🔒</span>
          <span class="step-q">第 ${i + 1} 步 · 完成上一步后解锁</span>
        </div>`;
    }
    wrap.appendChild(el);
  });
}

/* 根据难度生成可见选项（含显示顺序的确定性洗牌） */
function buildVisibleOptions(step, count, seed) {
  const correctIdx = step.answer;
  const wrongIdxs = step.options
    .map((_, i) => i)
    .filter(i => i !== correctIdx);
  const keepWrong = count - 1;
  const shuffledWrong = seededShuffle(wrongIdxs, seed + 17);
  const keep = [correctIdx, ...shuffledWrong.slice(0, keepWrong)];
  const shuffled = seededShuffle(keep, seed + 99);
  return shuffled.map(orig => ({
    original: orig,
    text: step.options[orig]
  }));
}

/* =========================================================
   事件委托：选项点击
   ========================================================= */
document.getElementById('steps').addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn || btn.disabled) return;
  const stepIdx = +btn.dataset.step;
  const origIdx = +btn.dataset.orig;
  handleChoose(stepIdx, origIdx);
});

function handleChoose(stepIdx, origIdx) {
  const inst = visibleInstances[current];
  if (!inst) return;
  const p = inst.problem, st = inst.state;
  if (stepIdx !== st.stepIdx) return;
  if (st.solved) return;
  const s = p.steps[stepIdx];

  if (origIdx === s.answer) {
    st.chosen[stepIdx] = origIdx;
    st.stepIdx++;
    // 折叠：答对后立即折叠，让下个步骤露出来
    st.expanded[stepIdx] = false;
    SFX.correct();
    addScore(10, false);
    incCombo();

    renderFacts();
    renderSteps();
    renderAnswer();
    renderDots();

    // 平滑滚动到下一步
    if (st.stepIdx < p.steps.length) {
      requestAnimationFrame(() => {
        const nodes = document.querySelectorAll('.step');
        const next = nodes[st.stepIdx];
        if (next) {
          const y = next.getBoundingClientRect().top + window.scrollY - 100;
          window.scrollTo({ top: y, behavior: 'smooth' });
        }
      });
    } else {
      requestAnimationFrame(() => {
        const input = $('ansInput');
        if (input) {
          input.focus({ preventScroll: true });
          const y = input.getBoundingClientRect().top + window.scrollY - 200;
          window.scrollTo({ top: y, behavior: 'smooth' });
        }
      });
    }
  } else {
    if (!st.tried[stepIdx].includes(origIdx)) st.tried[stepIdx].push(origIdx);
    st.hadWrong = true;
    resetCombo();
    SFX.wrong();
    renderSteps();
    if (st.tried[stepIdx].length === 1) {
      addWrongRecord(inst, {
        stepIdx: stepIdx + 1,
        stepQ: s.q,
        wrongChoice: LETTER[origIdx] + '. ' + s.options[origIdx],
        correctChoice: LETTER[s.answer] + '. ' + s.options[s.answer]
      });
    }
  }
}

/* =========================================================
   答题区
   ========================================================= */
function renderAnswer() {
  const inst = visibleInstances[current];
  if (!inst) return;
  const p = inst.problem, st = inst.state;
  const card = $('answerCard'), inner = $('answerInner');

  if (st.timedOut) {
    card.classList.remove('locked');
    inner.innerHTML = `
      <div class="answer-hint" style="color:#E63A3A;">⏰ 时间到了！正确答案是 <b>${p.answer} ${p.unit}</b></div>
      <div class="feedback show no">这道题没有按时完成，已经记录到错题本啦。<br>
        <span class="fb-sub">点"🔄 换一题"再来一道，或去错题本复习一下。</span></div>`;
    return;
  }

  if (st.stepIdx < p.steps.length) {
    card.classList.add('locked');
    inner.innerHTML = `<div class="lock-msg">🔒 完成上面 ${p.steps.length} 个思考步骤后，<br>就可以在这里填写最终答案啦</div>`;
    return;
  }

  card.classList.remove('locked');
  inner.innerHTML = `
    <div class="answer-hint">✍ 自己算出最后一步的结果，填进来看看！</div>
    <div class="answer-row">
      <span class="answer-label">我的答案：</span>
      <input id="ansInput" type="text" inputmode="decimal" placeholder="?">
      <span class="unit">${p.unit}</span>
      <button class="btn btn-primary" id="checkBtn">检 查</button>
    </div>
    <div class="feedback" id="feedback"></div>`;

  $('checkBtn').addEventListener('click', check);
  $('ansInput').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });

  if (st.solved) {
    const input = $('ansInput');
    input.value = p.answer;
    input.disabled = true;
    showFb('ok', `✔ 完全正确！答案是 <b>${p.answer} ${p.unit}</b>。<br><span class="fb-sub">${p.praise}</span>`);
  }
}

function showFb(type, html) {
  const fb = $('feedback');
  if (!fb) return;
  fb.className = 'feedback show ' + type;
  fb.innerHTML = html;
}

function check() {
  const inst = visibleInstances[current];
  if (!inst) return;
  const p = inst.problem, st = inst.state;
  if (st.solved) return;
  const raw = $('ansInput').value.trim();

  if (raw === '') { showFb('warn', '先算一算，把结果写在框里吧～'); return; }
  const num = Number(raw);
  if (isNaN(num)) { showFb('warn', '请输入一个数字哦。'); return; }

  if (Math.abs(num - p.answer) < 1e-6) {
    st.solved = true;
    st.timeUsed = timerEnabled ? (TIME_LIMIT - timerRemaining) : 0;
    $('ansInput').disabled = true;
    stopTimer();
    $('timerBar').style.display = 'none';
    showFb('ok', `✔ 完全正确！答案是 <b>${p.answer} ${p.unit}</b>。<br><span class="fb-sub">${p.praise}</span>`);
    renderDots();

    addScore(30, false);
    incCombo();

    if (!st.hadWrong) {
      incPerfect();
      setTimeout(() => {
        addScore(20, true);
        SFX.perfect();
        floatScore('完美通关', true);
      }, 400);
    } else {
      SFX.success();
    }

    if (!st.recorded) {
      st.recorded = true;
      const pts = scoreVisible ? 30 + (st.hadWrong ? 0 : 20) : 0;
      addHistoryRecord(inst, pts, !st.hadWrong, st.timeUsed);
    }
  } else {
    st.hadWrong = true;
    resetCombo();
    SFX.wrong();
    showFb('no', `✘ 还差一点，再想一想。<br><span class="fb-sub">${p.wrongTip}</span>`);
    if (!st.wrongAnswerRecorded) {
      st.wrongAnswerRecorded = true;
      addWrongRecord(inst, {
        stepIdx: 'answer',
        stepQ: '最终答案',
        wrongChoice: raw,
        correctChoice: p.answer + ' ' + p.unit
      });
    }
  }
}

function renderDots() {
  const wrap = $('dots');
  wrap.innerHTML = '';
  visibleInstances.forEach((inst, i) => {
    const d = document.createElement('div');
    d.className = 'dot-i'
      + (inst.state.solved ? ' done' : '')
      + (i === current ? ' active' : '');
    d.addEventListener('click', () => {
      if (i !== current) {
        current = i;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
    wrap.appendChild(d);
  });
}

/* =========================================================
   悬浮按钮
   ========================================================= */
const backBtn = $('backToFacts');
const factsBox = $('factsBox');

let rafPending = false;
function updateBackBtn() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    if (!backBtn || !factsBox || currentTab !== 'practice') {
      if (backBtn) backBtn.classList.remove('show');
      return;
    }
    const rect = factsBox.getBoundingClientRect();
    backBtn.classList.toggle('show', rect.bottom < 60);
  });
}

let flashTimer = null;
function backToFacts() {
  if (!factsBox) return;
  factsBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  clearTimeout(flashTimer);
  factsBox.classList.remove('flash');
  void factsBox.offsetWidth;
  factsBox.classList.add('flash');
  flashTimer = setTimeout(() => factsBox.classList.remove('flash'), 1200);
}
if (backBtn) backBtn.addEventListener('click', backToFacts);
window.addEventListener('scroll', updateBackBtn, { passive: true });
window.addEventListener('resize', updateBackBtn);

/* =========================================================
   分数/音效开关
   ========================================================= */
$('scoreToggle').addEventListener('click', () => {
  scoreVisible = !scoreVisible;
  $('scoreBar').classList.toggle('collapsed', !scoreVisible);
  $('scoreToggle').textContent = scoreVisible ? '隐藏分数' : '显示分数 ⭐';
  SFX.click();
});
$('soundToggle').addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  const btn = $('soundToggle');
  btn.classList.toggle('muted', !soundEnabled);
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  if (soundEnabled) { ensureAudio(); SFX.click(); }
});

/* =========================================================
   难度切换
   ========================================================= */
$('diffFilter').addEventListener('click', e => {
  const btn = e.target.closest('.diff-btn');
  if (!btn) return;
  const diff = +btn.dataset.diff;
  if (diff === currentDiff) return;
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.toggle('active', b === btn));
  currentDiff = diff;
  // 切换难度：重置所有题目状态（因为选项数量变了）
  instances.forEach(inst => resetInstanceState(inst));
  current = 0;
  SFX.click();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* =========================================================
   计时开关
   ========================================================= */
$('timerToggle').addEventListener('click', () => {
  timerEnabled = !timerEnabled;
  const btn = $('timerToggle');
  btn.classList.toggle('on', timerEnabled);
  btn.textContent = timerEnabled ? '⏱ 开' : '⏱';
  SFX.click();
  if (timerEnabled) startTimer();
  else {
    stopTimer();
    const b = $('timerBar'); if (b) b.style.display = 'none';
  }
});

/* =========================================================
   导航
   ========================================================= */
$('prevBtn').addEventListener('click', () => {
  if (current > 0) { current--; SFX.click(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
});
$('nextBtn').addEventListener('click', () => {
  if (current < visibleInstances.length - 1) { current++; SFX.click(); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
});
$('resetBtn').addEventListener('click', () => {
  const inst = visibleInstances[current];
  if (!inst) return;
  resetInstanceState(inst);
  SFX.click();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
$('changeBtn').addEventListener('click', () => {
  const inst = visibleInstances[current];
  if (!inst) return;
  const idx = instances.indexOf(inst);
  if (idx >= 0) regenerate(idx);
  SFX.click();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  const btn = $('changeBtn');
  btn.textContent = '✓ 已换题';
  setTimeout(() => { btn.textContent = '🔄 换一题'; }, 800);
});

/* =========================================================
   Tab 切换
   ========================================================= */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    currentTab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    $('page-practice').style.display = tab === 'practice' ? 'block' : 'none';
    $('page-wrong').style.display = tab === 'wrong' ? 'block' : 'none';
    $('page-history').style.display = tab === 'history' ? 'block' : 'none';
    SFX.click();
    if (tab === 'wrong') renderWrongBook();
    if (tab === 'history') renderHistory();
    if (tab !== 'practice') stopTimer();
    else startTimer();
    updateBackBtn();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

/* =========================================================
   错题本
   ========================================================= */
function renderWrongBadge() {
  const b = $('wrongBadge');
  if (b) b.textContent = wrongBook.length;
}

function renderWrongBook() {
  const list = $('wrongList');
  if (!list) return;
  if (wrongBook.length === 0) {
    list.innerHTML = `<div class="empty-state">
      <span class="em-icon">🎉</span>还没有错题<br>继续加油，保持这个好状态！</div>`;
    return;
  }
  list.innerHTML = wrongBook.map(r => {
    const diffName = DIFF_CONFIG[r.difficulty] ? DIFF_CONFIG[r.difficulty].name : '';
    const stepLabel = r.wrongStep === 'answer' ? '最终答案' : `第 ${r.wrongStep} 步`;
    return `<div class="record-card wrong">
      <div class="record-head">
        <span class="record-tag">${r.qtag} · ${diffName}</span>
        <span class="record-time">${fmtTime(r.timestamp)}</span>
      </div>
      <div class="record-q">${hl(r.qtext)}</div>
      <div class="record-line wrong-line">
        <span class="lbl">✘ 你的选择：</span>
        <span>${r.wrongStep === 'answer' ? '' : stepLabel + ' · '}${r.wrongChoice}</span>
      </div>
      <div class="record-line right-line">
        <span class="lbl">✔ 正确思路：</span>
        <span>${r.wrongStep === 'answer' ? '答案 ' + r.correctChoice : stepLabel + ' · ' + r.correctChoice}</span>
      </div>
      <div class="record-actions">
        <button data-remove="${r.id}">🗑 删除</button>
      </div>
    </div>`;
  }).join('');
  list.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.remove;
      wrongBook = wrongBook.filter(x => x.id !== id);
      trySave('mathWrongBook', wrongBook);
      renderWrongBadge();
      renderWrongBook();
      SFX.click();
    });
  });
}

/* =========================================================
   历史
   ========================================================= */
function renderHistory() {
  const statsEl = $('historyStats'), list = $('historyList');
  if (!list || !statsEl) return;
  if (history.length === 0) {
    statsEl.innerHTML = '';
    list.innerHTML = `<div class="empty-state">
      <span class="em-icon">📖</span>还没有练习记录<br>去练习页做几道题吧！</div>`;
    return;
  }
  const totalScore = history.reduce((s, r) => s + (r.score || 0), 0);
  const perfectTotal = history.filter(r => r.perfect).length;
  statsEl.innerHTML = `
    <div class="stat-box"><span class="num">${history.length}</span><span class="lbl">已做题目</span></div>
    <div class="stat-box"><span class="num">${totalScore}</span><span class="lbl">累计得分</span></div>
    <div class="stat-box"><span class="num">${perfectTotal}</span><span class="lbl">完美通关</span></div>`;
  list.innerHTML = history.map(r => {
    const diffName = DIFF_CONFIG[r.difficulty] ? DIFF_CONFIG[r.difficulty].name : '';
    const t = r.timeUsed > 0 ? `${r.timeUsed}s` : '—';
    return `<div class="record-card ok">
      <div class="record-head">
        <span class="record-tag">${r.qtag} · ${diffName}</span>
        <span class="record-time">${fmtTime(r.timestamp)} · 用时 ${t}</span>
      </div>
      <div class="record-q">${hl(r.qtext)}</div>
      <div class="record-line right-line">
        <span class="lbl">${r.perfect ? '🏆 完美' : '✔ 完成'}</span>
        <span>得分 +${r.score}</span>
      </div>
    </div>`;
  }).join('');
}

$('clearWrong').addEventListener('click', () => {
  if (wrongBook.length === 0) return;
  if (confirm('确定要清空错题本吗？')) {
    wrongBook = [];
    trySave('mathWrongBook', wrongBook);
    renderWrongBadge();
    renderWrongBook();
    SFX.click();
  }
});
$('clearHistory').addEventListener('click', () => {
  if (history.length === 0) return;
  if (confirm('确定要清空练习历史吗？')) {
    history = [];
    trySave('mathHistory', history);
    renderHistory();
    SFX.click();
  }
});

/* =========================================================
   启动
   ========================================================= */
function boot() {
  try {
    initAll();
    render();
    renderWrongBadge();
    requestAnimationFrame(updateBackBtn);
  } catch (e) {
    console.error('初始化失败:', e);
    const hero = document.querySelector('.hero');
    if (hero) {
      const err = document.createElement('div');
      err.style.cssText = 'background:#FFF3E0;color:#B26A00;padding:14px 18px;border-radius:14px;margin:16px 0;font-size:13px;line-height:1.7;';
      err.innerHTML = '<b>页面初始化出错：</b>' + e.message + '<br>请刷新重试。';
      hero.after(err);
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
