<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数学思维闯关 · 四年级上册</title>
<style>
*,*::before,*::after{box-sizing:border-box;}

:root{
  --ink:#3a3355;
  --ink-2:#4a4166;
  --ink-3:#6b6385;
  --muted:#a79fc2;
  --line:#EDE8FF;
  --line-2:#E4DDFF;
  --purple:#6B4CE6;
  --purple-2:#8B6BFF;
  --purple-deep:#4E35C4;
  --gold:#FFA751;
  --gold-2:#FFD86B;
  --gold-deep:#E8944A;
  --pink:#FF6B9D;
  --pink-deep:#B83060;
  --green:#2ED573;
  --green-deep:#1FA85A;
  --red:#E63A3A;
  --card:#ffffff;
  --shadow-1:0 4px 0 rgba(124,92,255,.06),0 10px 22px rgba(124,92,255,.08);
  --shadow-2:0 5px 0 rgba(124,92,255,.07),0 16px 32px rgba(124,92,255,.11);
}

body{
  margin:0;padding:0;min-height:100vh;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background-color:#FFFBF2;
  background-image:
    radial-gradient(circle at 10% 15%, #FFE9A8 0%, transparent 38%),
    radial-gradient(circle at 90% 12%, #B8E5FF 0%, transparent 35%),
    radial-gradient(circle at 82% 88%, #FFD4E7 0%, transparent 38%),
    radial-gradient(circle at 15% 88%, #C6F3D9 0%, transparent 35%);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 64px;}

.hero{text-align:center;margin-bottom:14px;}
/* 吊猪动图自带动作，不要再叠 CSS 动画 */
.hero .mascot{display:block;margin:0 auto 4px;width:88px;height:auto;max-width:32vw;}
@media(max-width:520px){ .hero .mascot{width:76px;} }
.hero h1{font-size:27px;margin:0 0 7px;font-weight:900;letter-spacing:.8px;
  background:linear-gradient(120deg,#FF9F43 0%,#FF6B9D 45%,#7C5CFF 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.hero p{margin:0;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.5px;}

/* ============ 顶部标签 ============ */
.tab-nav{display:flex;gap:8px;margin-bottom:14px;padding:6px;
  background:#fff;border-radius:18px;
  border:2.5px solid #FFE3A8;box-shadow:0 4px 0 #FFE3A8;}
.tab-btn{flex:1;min-height:48px;padding:10px 12px;border:none;background:transparent;
  font-family:inherit;font-size:14.5px;font-weight:800;color:#8B7FD0;
  cursor:pointer;border-radius:12px;transition:.2s;letter-spacing:.3px;}
.tab-btn:hover{background:#F8F6FF;color:var(--purple);}
.tab-btn.active{background:linear-gradient(135deg,var(--purple-2),var(--purple));color:#fff;
  box-shadow:0 3px 0 var(--purple-deep);}
.tab-btn .badge{display:inline-block;min-width:19px;height:19px;
  padding:0 5px;margin-left:3px;background:var(--pink);color:#fff;
  font-size:11px;font-weight:900;border-radius:10px;line-height:19px;text-align:center;}
.tab-btn.active .badge{background:#fff;color:var(--purple);}

/* ============ 计分条 ============ */
.score-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;
  margin-bottom:14px;background:#fff;border-radius:18px;border:2.5px solid #FFE3A8;
  box-shadow:0 4px 0 #FFE3A8,0 12px 28px rgba(255,200,100,.18);}
.score-item{display:flex;align-items:center;gap:5px;padding:6px 10px;
  border-radius:12px;background:linear-gradient(140deg,#FFFCF2,#FFF6E0);}
.score-icon{font-size:16px;line-height:1;}
.score-value{font-size:17px;font-weight:900;color:#D97706;
  min-width:18px;text-align:center;transition:color .2s;}
.score-label{font-size:11.5px;font-weight:800;color:var(--muted);}
.score-actions{margin-left:auto;display:flex;gap:5px;}
.score-toggle{border:none;background:transparent;color:#8B7FD0;
  font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;
  min-height:44px;padding:6px 10px;border-radius:10px;transition:.18s;}
.score-toggle:hover{background:#F6F2FF;color:var(--purple);}
.score-bar.collapsed .score-item{display:none;}
.score-bar.collapsed .score-actions{margin-left:0;}
.score-value.pulse{animation:scorePulse .55s ease;}
@keyframes scorePulse{
  0%{transform:scale(1);color:#D97706;}
  45%{transform:scale(1.55);color:var(--gold);}
  100%{transform:scale(1);color:#D97706;}
}
.score-float{position:fixed;z-index:999;pointer-events:none;
  font-size:24px;font-weight:900;color:var(--gold);
  transform:translate(-50%,0);will-change:transform,opacity;
  text-shadow:0 2px 6px rgba(255,150,50,.4);
  animation:floatUp 1.4s cubic-bezier(.34,1.2,.64,1) forwards;}
.score-float.bonus{font-size:28px;color:var(--pink);}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.5);}
  18%{opacity:1;transform:translate(-50%,-14px) scale(1.18);}
  35%{transform:translate(-50%,-22px) scale(1);}
  100%{opacity:0;transform:translate(-50%,-80px) scale(1);}
}

/* ============ 进度条（本轮目标） ============ */
.goal-bar{padding:12px 16px;margin-bottom:14px;background:#fff;border-radius:18px;
  box-shadow:0 3px 0 rgba(124,92,255,.06),0 8px 18px rgba(124,92,255,.08);
  border:2px solid #EFE9FF;}
.goal-line{display:flex;align-items:center;gap:8px;font-size:14px;
  font-weight:800;color:var(--ink-2);margin-bottom:8px;}
.goal-line .goal-num{margin-left:auto;color:var(--purple);font-weight:900;font-size:15px;}
.goal-track{height:14px;background:#F1ECFF;border-radius:8px;overflow:hidden;}
.goal-fill{height:100%;width:0%;border-radius:8px;
  background:linear-gradient(90deg,#7DE7A8,#2ED573);
  transition:width .45s cubic-bezier(.34,1.2,.64,1);}
.goal-bar.reached{border-color:#B6EFCB;background:linear-gradient(140deg,#FBFFFD,#F3FFF8);}
.goal-bar.reached .goal-fill{background:linear-gradient(90deg,var(--gold-2),var(--gold));}
.goal-bar.reached .goal-num{color:#17914F;}

/* ============ 单元选择 ============ */
.tool-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;
  margin-bottom:14px;background:#fff;border-radius:18px;
  box-shadow:0 4px 0 rgba(124,92,255,.06),0 10px 22px rgba(124,92,255,.08);}
.unit-btn{display:flex;align-items:center;gap:8px;min-height:46px;
  padding:9px 14px;border:2.5px solid var(--line);background:#F8F6FF;
  border-radius:14px;font-family:inherit;font-size:14.5px;font-weight:800;
  color:var(--purple);cursor:pointer;transition:.18s;
  box-shadow:0 3px 0 var(--line-2);max-width:100%;}
.unit-btn:hover{background:#F1ECFF;}
.unit-btn.open{background:linear-gradient(135deg,var(--purple-2),var(--purple));
  color:#fff;border-color:transparent;box-shadow:0 3px 0 var(--purple-deep);}
.unit-btn .unit-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.unit-btn .unit-caret{font-size:12px;flex:none;}
.unit-btn.open .unit-caret{transform:rotate(180deg);}
.tool-actions{margin-left:auto;display:flex;gap:6px;flex:none;}
.timer-btn,.sound-btn{min-height:46px;padding:8px 13px;border:none;border-radius:14px;
  background:#F8F6FF;color:#8B7FD0;font-family:inherit;
  font-size:14.5px;font-weight:800;cursor:pointer;transition:.18s;
  box-shadow:0 3px 0 var(--line-2);flex:none;}
.timer-btn:hover,.sound-btn:hover{background:#F1ECFF;color:var(--purple);}
.timer-btn.on{background:linear-gradient(135deg,var(--pink),#E64A7C);
  color:#fff;box-shadow:0 3px 0 var(--pink-deep);}
.sound-btn.muted{opacity:.5;}

.unit-panel{display:none;padding:16px;margin-bottom:14px;background:#fff;
  border-radius:20px;border:2.5px dashed #D8CEFF;
  box-shadow:0 5px 0 rgba(124,92,255,.06),0 12px 26px rgba(124,92,255,.09);}
.unit-panel.open{display:block;animation:fadeUp .22s ease;}
.unit-panel-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:14.5px;font-weight:900;color:var(--ink-2);margin-bottom:12px;}
.unit-panel-head .spacer{flex:1;}
.unit-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.unit-chip{display:flex;align-items:center;gap:7px;min-height:44px;
  padding:9px 14px;border:2.5px solid var(--line);border-radius:14px;
  background:#F8F6FF;color:#7C6FA8;font-family:inherit;font-size:14px;
  font-weight:800;cursor:pointer;transition:.18s;box-shadow:0 3px 0 var(--line-2);
  text-align:left;line-height:1.35;}
.unit-chip:hover{background:#F1ECFF;color:var(--purple);}
.unit-chip .chip-tick{font-size:13px;flex:none;opacity:.35;}
.unit-chip .chip-sub{display:block;font-size:11.5px;font-weight:700;opacity:.75;margin-top:1px;}
.unit-chip.on{background:linear-gradient(135deg,#8B6BFF,#6B4CE6);color:#fff;
  border-color:transparent;box-shadow:0 3px 0 var(--purple-deep);}
.unit-chip.on .chip-tick{opacity:1;}
.unit-summary{font-size:13.5px;font-weight:700;color:var(--ink-3);
  padding:10px 14px;border-radius:12px;background:#FAF8FF;line-height:1.7;}
.unit-summary b{color:var(--purple);font-weight:900;}
.unit-summary.warn{background:#FFF7EC;color:#B26A00;}
.unit-summary.warn b{color:#B26A00;}

/* ============ 计时条 ============ */
.timer-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;
  margin-bottom:14px;background:#fff;border-radius:16px;
  box-shadow:0 3px 0 rgba(255,150,150,.15);border:2px solid #FFD9AB;}
.timer-bar.urgent{border-color:#FF6B6B;animation:timerShake .5s ease;}
@keyframes timerShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}
.timer-track{flex:1;height:12px;background:#F1ECFF;border-radius:6px;overflow:hidden;}
.timer-progress{height:100%;width:100%;border-radius:6px;
  background:linear-gradient(90deg,#4EE08B,#2ED573);
  transition:width .95s linear,background .3s;will-change:width;}
.timer-bar.urgent .timer-progress{background:linear-gradient(90deg,#FF6B6B,#E63A3A);}
.timer-text{font-size:14px;font-weight:900;color:#8B7FD0;
  min-width:52px;text-align:right;}
.timer-bar.urgent .timer-text{color:var(--red);}

.card{background:var(--card);border-radius:24px;box-shadow:var(--shadow-2);}

.problem{padding:20px 22px 22px 26px;margin-bottom:16px;position:relative;overflow:hidden;}
.problem::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;
  background:linear-gradient(180deg,#FFB84D 0%,#FF7A9C 55%,#A78BFA 100%);}
.meta{display:flex;justify-content:space-between;align-items:center;
  font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:12px;
  gap:8px;flex-wrap:wrap;}
.meta .tag{background:linear-gradient(135deg,#FFE08A,#FFC24D);
  color:#8a5a00;padding:5px 13px;border-radius:20px;font-weight:800;
  font-size:12.5px;box-shadow:0 2px 0 #EBA92E;}
.meta .counter{margin-left:auto;}
.qtext{font-size:17.5px;line-height:1.95;color:var(--ink);font-weight:500;}
.qtext b{color:#5B3FD9;font-weight:800;
  background:linear-gradient(180deg,transparent 62%,#DDD4FF 62%,#DDD4FF 92%,transparent 92%);
  padding:0 2px;}

.facts{padding:18px 20px 20px;margin-bottom:22px;
  background:linear-gradient(140deg,#FFFCF2 0%,#F5FBFF 55%,#FBF6FF 100%);
  border:2.5px dashed #FFD98A;border-radius:24px;
  box-shadow:0 5px 0 rgba(255,200,100,.10),0 14px 28px rgba(255,180,80,.10);
  scroll-margin-top:18px;}
.facts.flash{animation:factsFlash 1.1s ease;}
@keyframes factsFlash{
  0%,100%{box-shadow:0 5px 0 rgba(255,200,100,.10),0 14px 28px rgba(255,180,80,.10);border-color:#FFD98A;}
  30%{box-shadow:0 0 0 7px rgba(255,200,100,.42);border-color:#FFB84D;}
}
.facts-head{display:flex;align-items:center;gap:8px;font-size:14.5px;
  font-weight:900;color:var(--ink-2);margin-bottom:5px;}
.facts-count{font-size:11.5px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--purple-2),var(--purple));
  padding:3px 10px;border-radius:20px;margin-left:auto;
  box-shadow:0 2px 0 var(--purple-deep);}
.facts-sub{font-size:12.5px;color:var(--muted);margin-bottom:13px;padding-left:26px;font-weight:600;}
.facts-list{display:flex;flex-wrap:wrap;gap:10px;min-height:2px;}
.fact{display:flex;align-items:center;gap:9px;background:#fff;color:var(--ink-2);
  font-size:13.5px;font-weight:600;padding:9px 15px 9px 9px;
  border-radius:14px;line-height:1.5;border:2.5px solid #FFE3A8;
  box-shadow:0 3px 0 #FFE3A8;
  animation:factPop .42s cubic-bezier(.34,1.5,.64,1);}
.fact-no{flex:none;width:22px;height:22px;border-radius:8px;
  background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#fff;
  font-size:11.5px;font-weight:900;display:flex;align-items:center;
  justify-content:center;box-shadow:0 1.5px 0 var(--gold-deep);}
.fact b{color:#D97706;font-weight:900;}
.fact.locked{background:#F6F4FC;border:2.5px dashed #D8D2EC;
  box-shadow:none;color:#B0A9C6;animation:none;}
.fact.locked .fact-no{background:#E4DFF3;color:#B0A9C6;box-shadow:none;}
.fact-hidden{font-style:normal;font-size:13px;}
.facts-empty{padding:14px 4px;font-size:13.5px;color:var(--muted);
  text-align:center;line-height:1.8;width:100%;font-weight:600;}
@keyframes factPop{
  0%{opacity:0;transform:scale(.8) translateY(8px);}
  60%{opacity:1;transform:scale(1.05) translateY(-2px);}
  100%{opacity:1;transform:scale(1) translateY(0);}
}

.section-title{display:flex;align-items:center;gap:9px;font-size:14px;
  font-weight:800;color:var(--ink-3);margin:0 0 13px 6px;flex-wrap:wrap;}
.dot-mark{width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,#FFB84D,#FF7A9C);
  box-shadow:0 0 0 3px rgba(255,140,120,.18);flex:none;}
.spacer{flex:1;}
.mini-btn{border:none;background:#fff;color:#7C5CFF;font-size:14.5px;
  font-weight:800;cursor:pointer;font-family:inherit;padding:8px 14px;
  min-height:44px;border-radius:12px;transition:transform .15s,box-shadow .15s,background .15s;
  box-shadow:0 3px 0 rgba(124,92,255,.13);}
.mini-btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 rgba(124,92,255,.18);background:#F8F6FF;}
.mini-btn:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(124,92,255,.13);}
.mini-btn.primary{background:linear-gradient(135deg,var(--gold-2),var(--gold));
  color:#8a5a00;box-shadow:0 3px 0 var(--gold-deep);}
.mini-btn.danger{color:#C2410C;}
.mini-btn.danger:hover{background:#FFF4EC;}
.mini-btn.arming{background:#FFF4EC;color:#9A3412;
  box-shadow:0 3px 0 rgba(194,65,12,.2);}

/* ============ 步骤卡 ============ */
.step{background:#fff;border-radius:20px;margin-bottom:12px;
  box-shadow:0 4px 0 rgba(124,92,255,.06),0 10px 22px rgba(124,92,255,.09);
  overflow:hidden;transition:box-shadow .25s,transform .2s;}
.step.active{box-shadow:0 0 0 3px #A78BFA,0 12px 28px rgba(124,92,255,.22);}
.step.locked{opacity:.55;background:#FAF9FE;box-shadow:0 2px 0 rgba(124,92,255,.04);}
.step.done{background:linear-gradient(180deg,#FBFFFD,#F6FFFA);}

.step-head{display:flex;align-items:center;gap:12px;padding:16px 20px;}
.step.locked .step-head{padding:13px 20px;}
.step-num{flex:none;width:28px;height:28px;border-radius:10px;
  background:#EDE8FF;color:#7C5CFF;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 0 #D8CEFF;transition:background .2s,color .2s,transform .2s;}
.step.active .step-num{background:linear-gradient(135deg,var(--purple-2),var(--purple));
  color:#fff;box-shadow:0 3px 0 var(--purple-deep);}
.step.done .step-num{background:linear-gradient(135deg,#4EE08B,#2ED573);
  color:#fff;box-shadow:0 3px 0 var(--green-deep);font-size:14px;}
.step.locked .step-num{background:#EDEBF5;color:#B0A9C6;
  box-shadow:0 2px 0 #E0DDF0;font-size:13px;}
.step-q{font-size:15px;font-weight:800;color:var(--ink-2);line-height:1.6;flex:1;}
.step.done .step-q{color:var(--ink-3);font-weight:700;font-size:14px;}
.step.locked .step-q{color:#B0A9C6;font-weight:600;font-size:13.5px;}

.step.done{cursor:pointer;}
.step.done .step-head{padding:11px 20px;transition:background .2s;}
.step.done .step-head:hover{background:rgba(78,224,139,.06);}
.step-chevron{flex:none;color:#8B7FD0;font-size:13px;
  transition:transform .3s cubic-bezier(.34,1.2,.64,1);display:inline-block;}
.step.done.expanded .step-chevron{transform:rotate(180deg);}

.step-body-wrap{display:grid;grid-template-rows:0fr;
  transition:grid-template-rows .35s cubic-bezier(.4,0,.2,1);will-change:grid-template-rows;}
.step.done.expanded .step-body-wrap{grid-template-rows:1fr;}
.step-body-wrap > .step-body{overflow:hidden;padding:0 18px 0 60px;}
.step.done.expanded .step-body-wrap > .step-body{padding:0 18px 18px 60px;}
@media(max-width:520px){
  .step-body-wrap > .step-body,
  .step.done.expanded .step-body-wrap > .step-body{padding-left:16px;padding-right:16px;}
}
.step.active .step-body{padding:0 18px 18px 60px;}
@media(max-width:520px){
  .step.active .step-body{padding:0 16px 16px 16px;}
}

.opts{margin-top:2px;}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  min-height:52px;padding:13px 16px;margin-bottom:10px;border-radius:16px;cursor:pointer;
  background:#F8F6FF;border:2.5px solid var(--line);box-shadow:0 3px 0 var(--line-2);
  font-family:inherit;font-size:15px;font-weight:700;color:var(--ink-2);
  line-height:1.55;transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;}
.opt:last-child{margin-bottom:0;}
.opt:hover:not(:disabled){background:#F1ECFF;border-color:#C4B5FD;
  box-shadow:0 4px 0 #C4B5FD;transform:translateY(-2px);}
.opt:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 0 #C4B5FD;}
.opt:disabled{cursor:default;}
.opt-key{flex:none;width:28px;height:28px;border-radius:10px;background:#fff;
  border:2px solid #DDD4FF;color:#8B7FD0;font-size:13px;font-weight:900;
  display:flex;align-items:center;justify-content:center;transition:.18s;}
.opt:hover:not(:disabled) .opt-key{border-color:#A78BFA;color:var(--purple);}
.opt.wrong{background:#FFF6EC;border-color:#FFD9AB;box-shadow:0 3px 0 #FFD9AB;color:#b06a10;}
.opt.wrong .opt-key{background:#FFD9AB;border-color:#FFD9AB;color:#fff;}
.opt.wrong .opt-text{text-decoration:line-through;opacity:.65;}

.fb-inline{margin-top:12px;font-size:13.5px;line-height:1.85;
  padding:12px 16px;border-radius:14px;font-weight:700;animation:fadeUp .25s ease;}
.fb-inline.ok{background:#E4FBEE;color:#17914F;}
.fb-inline.no{background:#FFF3E0;color:#B26A00;}
.chosen-line{font-size:14px;color:var(--ink-3);margin-top:12px;margin-bottom:9px;font-weight:600;}
.chosen-line b{color:#17914F;font-weight:800;}
@keyframes fadeUp{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:translateY(0);}}

/* ============ 答题区 ============ */
.answer{margin-top:24px;padding:22px;transition:.3s;}
.answer.locked{background:#FAF9FE;box-shadow:0 3px 0 rgba(124,92,255,.05);}
.lock-msg{font-size:13.5px;color:var(--muted);text-align:center;line-height:1.9;font-weight:700;}
.answer-hint{font-size:12.5px;color:#8B7FD0;font-weight:700;margin-bottom:12px;padding-left:2px;}
.answer-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.answer-label{font-size:15px;font-weight:800;color:var(--ink-2);}
#ansInput{width:140px;min-height:52px;padding:12px 15px;font-size:17px;font-weight:800;
  border:2.5px solid var(--line-2);border-radius:14px;outline:none;
  transition:border-color .2s,box-shadow .2s;font-family:inherit;
  color:var(--ink);background:#FBF9FF;text-align:center;}
#ansInput:focus{border-color:#A78BFA;background:#fff;box-shadow:0 0 0 5px rgba(167,139,250,.16);}
.unit{font-size:15px;color:var(--ink-3);font-weight:700;}
.btn{padding:13px 26px;border:none;border-radius:14px;font-size:15.5px;
  font-weight:800;cursor:pointer;font-family:inherit;min-height:52px;
  transition:transform .18s,box-shadow .18s;letter-spacing:.5px;}
.btn-primary{background:linear-gradient(135deg,var(--purple-2),var(--purple));color:#fff;

.feedback{margin-top:16px;font-size:14.5px;line-height:1.85;

/* ★ 大的「下一题」按钮

.next-wrap{margin-top:20px;}

  transition:transform .18s,box-shadow .18s;}
.next-big:hover{transform:translateY(-2px);
  box-shadow:0 8px 0 var(--green-deep),0 18px 32px rgba(46,213,115,.42);}

  font-weight:700;color:var(--muted);}

/* ============ 底部导航 ============ */
.nav{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:28px;}
.nav-btn{width:52px;height:52px;border-radius:50%;border:none;background:#fff;
  box-shadow:0 4px 0 rgba(124,92,255,.10),0 8px 18px rgba(124,92,255,.14);
  cursor:pointer;font-size:20px;font-weight:900;font-family:inherit;
  color:#7C5CFF;transition:transform .18s,box-shadow .18s;line-height:1;
  display:flex;align-items:center;justify-content:center;flex:none;}

  box-shadow:0 6px 0 rgba(124,92,255,.12),0 10px 22px rgba(124,92,255,.2);}
.nav-btn:disabled{opacity:.35;cursor:default;}
.nav-info{font-size:14px;font-weight:800;color:var(--ink-3);text-align:center;
  background:#fff;padding:11px 18px;border-radius:14px;min-height:44px;
  display:flex;align-items:center;
  box-shadow:0 3px 0 rgba(124,92,255,.07);}
.nav-info b{color:var(--purple);font-weight:900;margin:0 2px;}

.back-to-facts{position:fixed;right:24px;bottom:24px;z-index:100;
  display:flex;align-items:center;gap:7px;padding:13px 18px 13px 14px;
  min-height:48px;border:2.5px solid #C4B5FD;border-radius:999px;background:#fff;
  color:var(--purple);font-family:inherit;font-size:14.5px;font-weight:800;
  cursor:pointer;box-shadow:0 4px 0 #DDD4FF,0 12px 26px rgba(124,92,255,.20);
  opacity:0;transform:translateY(18px) scale(.9);pointer-events:none;
  transition:opacity .28s cubic-bezier(.34,1.3,.64,1),
             transform .28s cubic-bezier(.34,1.3,.64,1);}
.back-to-facts.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}

  .back-to-facts{right:14px;bottom:14px;padding:12px 16px 12px 12px;font-size:13.5px;}
}

.page-head{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:16px;padding:0 4px;gap:10px;flex-wrap:wrap;}
.page-head h2{font-size:19px;margin:0;font-weight:900;color:var(--ink-2);}
.page-head .mini-btn{background:linear-gradient(135deg,var(--gold-2),var(--gold));
  color:#8a5a00;box-shadow:0 3px 0 var(--gold-deep);}
.page-head .mini-btn.danger{background:#fff;color:#C2410C;box-shadow:0 3px 0 rgba(194,65,12,.18);}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);
  font-size:14px;font-weight:600;line-height:1.9;background:#fff;
  border-radius:24px;box-shadow:var(--shadow-2);}
.empty-state .em-icon{font-size:52px;display:block;margin-bottom:10px;}
.empty-state .mini-btn{margin-top:16px;background:linear-gradient(135deg,var(--gold-2),var(--gold));
  color:#8a5a00;box-shadow:0 3px 0 var(--gold-deep);}
.empty-state .empty-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
.empty-state .empty-actions .mini-btn{margin-top:0;}
.empty-state .mini-btn.ghost{background:#fff;color:var(--purple);
  box-shadow:0 3px 0 rgba(124,92,255,.13);}
.empty-state .mini-btn.ghost:hover{background:#F8F6FF;}

.record-card{background:#fff;border-radius:20px;padding:18px 20px;
  margin-bottom:14px;box-shadow:var(--shadow-1);
  position:relative;overflow:hidden;animation:factPop .35s cubic-bezier(.34,1.3,.64,1);}
.record-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;}
.record-card.wrong::before{background:linear-gradient(180deg,#FF9F43,#FF6B6B);}
.record-card.ok::before{background:linear-gradient(180deg,#4EE08B,#2ED573);}
.record-head{display:flex;justify-content:space-between;align-items:center;
  gap:8px;margin-bottom:10px;font-size:11.5px;font-weight:800;flex-wrap:wrap;}
.record-tag{background:linear-gradient(135deg,#FFE08A,#FFC24D);
  color:#8a5a00;padding:3px 10px;border-radius:12px;}
.record-time{color:var(--muted);font-weight:700;}
.record-q{font-size:14px;color:var(--ink-2);line-height:1.8;font-weight:600;margin-bottom:10px;}
.record-q b{color:#5B3FD9;font-weight:900;}
.record-line{display:flex;gap:8px;align-items:flex-start;font-size:13px;
  line-height:1.75;font-weight:700;margin-top:6px;padding:8px 12px;border-radius:10px;}
.record-line.wrong-line{background:#FFF3E0;color:#B26A00;}
.record-line.right-line{background:#E4FBEE;color:#17914F;}
.record-line .lbl{flex:none;font-weight:900;}
.record-actions{margin-top:12px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.record-actions button{border:none;background:#F8F6FF;color:#8B7FD0;
  padding:8px 14px;border-radius:10px;font-family:inherit;font-size:14.5px;
  font-weight:800;cursor:pointer;transition:.18s;min-height:44px;}
.record-actions button:hover{background:#F1ECFF;color:var(--purple);}
.record-actions button.redo{background:linear-gradient(135deg,#8B6BFF,#6B4CE6);
  color:#fff;box-shadow:0 3px 0 var(--purple-deep);}

/* 错题重做提示条 */
.redo-bar{display:none;align-items:center;gap:10px;flex-wrap:wrap;
  padding:12px 16px;margin-bottom:14px;border-radius:18px;
  background:linear-gradient(135deg,#FFF1F6,#F3EEFF);
  border:2.5px solid #FFC9DC;box-shadow:0 4px 0 rgba(255,107,157,.14);}
.redo-bar.on{display:flex;}
.redo-bar .redo-ico{font-size:17px;flex:none;}
.redo-bar .redo-txt{font-size:14px;font-weight:800;color:var(--pink-deep);
  flex:1;min-width:150px;line-height:1.5;}
.redo-bar .mini-btn{background:#fff;color:var(--pink-deep);
  box-shadow:0 3px 0 rgba(184,48,96,.16);flex:none;}

.stats-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.stat-box{flex:1;min-width:90px;padding:14px;background:#fff;border-radius:16px;
  text-align:center;box-shadow:0 3px 0 rgba(124,92,255,.06),0 8px 18px rgba(124,92,255,.08);}
.stat-box .num{font-size:22px;font-weight:900;color:var(--purple);display:block;}
.stat-box .lbl{font-size:11.5px;font-weight:800;color:var(--muted);margin-top:3px;display:block;}

/* ============ PK：同题竞速 ============ */
.pk-btn{min-height:46px;padding:8px 12px;border:none;border-radius:14px;
  background:#F8F6FF;color:#8B7FD0;font-family:inherit;
  font-size:14.5px;font-weight:800;cursor:pointer;transition:.18s;
  box-shadow:0 3px 0 var(--line-2);flex:none;}
.pk-btn:hover{background:#F1ECFF;color:var(--purple);}
.pk-btn.on{background:linear-gradient(135deg,var(--gold-2),var(--gold));
  color:#8a5a00;box-shadow:0 3px 0 var(--gold-deep);}

.pk-bar{display:none;padding:12px 14px;margin-bottom:14px;
  background:#fff;border-radius:20px;border:2.5px solid #FFE3A8;
  box-shadow:0 4px 0 #FFE3A8,0 12px 26px rgba(255,200,100,.18);}
.pk-bar.on{display:block;}
.pk-bar-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.pk-bar-head .pk-title{font-size:15px;font-weight:900;color:var(--ink-2);}
.pk-bar-head .pk-meta{font-size:12.5px;font-weight:800;color:var(--muted);}
.pk-bar-head .pk-meta b{color:var(--purple);}
.pk-limit{display:flex;align-items:center;gap:5px;font-size:12.5px;
  font-weight:800;color:var(--muted);}
.pk-limit-btn{min-height:36px;padding:5px 11px;border:none;border-radius:10px;
  background:#F8F6FF;color:#8B7FD0;font-family:inherit;font-size:13px;
  font-weight:800;cursor:pointer;box-shadow:0 2px 0 var(--line-2);}
.pk-limit-btn.on{background:linear-gradient(135deg,#8B6BFF,#6B4CE6);color:#fff;
  box-shadow:0 3px 0 var(--purple-deep);}
.pk-limit-btn:disabled{opacity:.4;cursor:default;}
.pk-add{min-height:44px;padding:9px 14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#8a5a00;
  font-family:inherit;font-size:14.5px;font-weight:800;cursor:pointer;
  box-shadow:0 3px 0 var(--gold-deep);transition:transform .15s;}
.pk-add:hover:not(:disabled){transform:translateY(-1px);}
.pk-add:disabled{opacity:.4;cursor:default;box-shadow:none;}

/* 所有人共用的选项（只读展示，按键在自己的格子里） */
.pk-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.pk-opt{display:flex;align-items:center;gap:9px;padding:14px 16px;border-radius:16px;
  background:#fff;border:2.5px solid var(--line);box-shadow:0 3px 0 var(--line-2);
  font-size:17px;font-weight:800;color:var(--ink-2);}
.pk-opt-key{flex:none;width:30px;height:30px;border-radius:10px;
  background:linear-gradient(135deg,#8B6BFF,#6B4CE6);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;}
.pk-opt .ans-unit{font-size:13px;font-weight:800;color:var(--muted);margin-left:3px;}
@media (max-width:700px){
  .pk-opts{grid-template-columns:repeat(2,1fr);gap:8px;}
  .pk-opt{font-size:15px;padding:11px 13px;}
}

/* 竞速计时条 */
.pk-race-timer{display:flex;align-items:center;gap:10px;padding:11px 15px;margin-bottom:14px;
  background:#fff;border-radius:16px;border:2px solid #FFD9AB;
  box-shadow:0 3px 0 rgba(255,150,150,.15);}
.pk-race-timer.urgent{border-color:#FF6B6B;}
.pk-race-timer.urgent .pk-race-fill{background:linear-gradient(90deg,#FF6B6B,#E63A3A);}
.pk-race-ico{font-size:15px;flex:none;}
.pk-race-track{flex:1;height:14px;background:#F1ECFF;border-radius:8px;overflow:hidden;}
.pk-race-fill{height:100%;width:100%;border-radius:8px;
  background:linear-gradient(90deg,#7DE7A8,#2ED573);transition:width .12s linear;}
.pk-race-text{font-size:15px;font-weight:900;color:#8B7FD0;min-width:46px;text-align:right;}
.pk-race-timer.urgent .pk-race-text{color:var(--red);}

/* 答题格：每人一格。用 auto-fit，2 人时各占一半、4 人时一行四列 */
.pk-pads{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
  align-items:stretch;}
.pk-pad{position:relative;padding:13px 13px 13px 19px;border-radius:18px;background:#fff;
  border:2.5px solid var(--line);box-shadow:0 4px 0 rgba(124,92,255,.08);
  overflow:hidden;transition:background .2s,border-color .2s;}
.pk-pad::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;
  background:var(--pk,#8B6BFF);}
.pk-pad-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.pk-pad .pk-name{font-size:14.5px;font-weight:900;color:var(--pk,#6B4CE6);
  cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pk-pad .pk-score{margin-left:auto;font-size:17px;font-weight:900;
  color:var(--pk,#6B4CE6);flex:none;}
.pk-pad .pk-score .pk-unit{font-size:11px;font-weight:800;opacity:.7;margin-left:1px;}
.pk-keys{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.pk-key{min-height:58px;border:2.5px solid var(--line);border-radius:14px;
  background:#F8F6FF;color:#6B4CE6;font-family:inherit;font-size:22px;font-weight:900;
  cursor:pointer;transition:transform .12s,background .12s,box-shadow .12s;
  box-shadow:0 3px 0 var(--line-2);}
.pk-key:hover:not(:disabled){background:#F1ECFF;transform:translateY(-1px);}
.pk-key:active:not(:disabled){transform:translateY(2px);box-shadow:none;}
.pk-key:disabled{cursor:default;opacity:.4;}
.pk-key.chosen-ok{background:#E4FBEE;border-color:var(--green);color:#17914F;
  opacity:1;box-shadow:0 3px 0 var(--green);}
.pk-key.chosen-no{background:#FFF3E0;border-color:var(--gold);color:#B26A00;
  opacity:1;box-shadow:0 3px 0 var(--gold);}
.pk-status{margin-top:9px;font-size:12.5px;font-weight:800;color:var(--muted);
  text-align:center;line-height:1.5;}
.pk-status.ok{color:#17914F;}
.pk-status.no{color:#B26A00;}
.pk-pad.correct-flash{background:#E4FBEE;border-color:var(--green);}
.pk-pad.wrong-flash{background:#FFF3E0;border-color:var(--gold);}
@keyframes pkPop{0%{transform:scale(1);}45%{transform:scale(1.035);}100%{transform:scale(1);}}
.pk-pad.correct-flash,.pk-pad.wrong-flash{animation:pkPop .5s ease;}
.pk-pad .pk-del{flex:none;width:28px;height:28px;border:none;border-radius:8px;
  background:rgba(0,0,0,.06);color:#8B7FD0;cursor:pointer;
  font-size:12px;font-weight:900;line-height:1;font-family:inherit;}
.pk-pad .pk-del:hover{background:rgba(0,0,0,.12);color:#C2410C;}

/* 本题结算 */
.pk-result{display:none;margin-top:16px;padding:18px;border-radius:20px;
  background:linear-gradient(140deg,#FFFCF2,#F5FBFF 60%,#FBF6FF);
  border:2.5px dashed #FFD98A;}
.pk-result.on{display:block;animation:fadeUp .25s ease;}
.pk-res-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  font-size:15px;font-weight:800;color:var(--ink-2);margin-bottom:12px;}
.pk-res-head b{color:var(--purple);font-weight:900;}
.pk-res-tip{margin-left:auto;font-size:13.5px;font-weight:900;color:#D97706;}
.pk-res-rows{display:grid;gap:8px;grid-template-columns:repeat(4,1fr);margin-bottom:12px;}
.pk-res-row{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:12px;
  background:#fff;border:2px solid var(--line);}
.pk-res-row.fast{background:linear-gradient(135deg,#FFF6DC,#FFEEC2);border-color:#FFD98A;}
.pk-res-row.hit{border-color:#B6EFCB;}
.pk-res-name{font-size:12.5px;font-weight:900;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pk-res-time{font-size:16px;font-weight:900;color:var(--ink-2);}
.pk-res-row.fast .pk-res-time{color:#D97706;}
.pk-res-row.hit .pk-res-time{color:#17914F;}
.pk-res-row.miss .pk-res-time{color:var(--muted);}
.pk-res-note{font-size:13.5px;line-height:1.8;font-weight:700;color:var(--ink-3);
  background:#fff;padding:12px 14px;border-radius:14px;}
@media (max-width:700px){ .pk-res-rows{grid-template-columns:repeat(2,1fr);} }
@media (max-width:899px){ .pk-pads{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;} }

  body[data-pk="1"] .wrap{max-width:min(1200px,96vw);}

  body[data-pk="1"] .pk-opt{font-size:18px;padding:16px 18px;}

}

<script>
/* =========================================================
   音效（Web Audio 合成，零外链）
   ========================================================= */
let audioCtx = null;
let soundEnabled = true;

function ensureAudio() {
  if (!soundEnabled) return false;
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { soundEnabled = false; return false; }
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
    return true;
  } catch (e) { soundEnabled = false; return false; }
}

function playNote(freq, dur, type, vol, delay) {
  if (!ensureAudio()) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    const now = audioCtx.currentTime + (delay || 0);
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(vol || 0.15, now + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
    osc.start(now);
    osc.stop(now + dur + 0.05);
  } catch (e) {}
}

  correct() {
    playNote(523.25, 0.10, 'sine', 0.16, 0);

  success() {

    playNote(659.25, 0.10, 'sine', 0.18, 0.08);
    playNote(783.99, 0.10, 'sine', 0.18, 0.16);
    playNote(1046.5, 0.30, 'sine', 0.18, 0.24);
  },
  perfect() {
    playNote(523.25, 0.09, 'sine', 0.20, 0);
    playNote(659.25, 0.09, 'sine', 0.20, 0.07);
    playNote(783.99, 0.09, 'sine', 0.20, 0.14);
    playNote(1046.5, 0.09, 'sine', 0.20, 0.21);
    playNote(1318.5, 0.35, 'sine', 0.20, 0.28);
  },
  click() { playNote(880, 0.035, 'sine', 0.06, 0); },
  levelup() {
    playNote(659.25, 0.10, 'sine', 0.18, 0);

function randInt(a, b) { return Math.floor(Math.random() * (b - a + 1)) + a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function shuffleAll(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* =========================================================
   选项构造器
   S(题干, 正确项, [3个干扰项], {ok, no, reveals})
   生成时就把顺序打乱并固定，重渲染时顺序不会变
   ========================================================= */
function S(q, correct, wrongs, extra) {
  const c = String(correct);
  const pool = shuffleAll([c, ...wrongs.slice(0, 3).map(String)]);
  const e = extra || {};
  return {
    q,
    options: pool,
    answer: pool.indexOf(c),
    correct: e.ok || '太棒了，就是这样！',
    wrong: e.no || '别急，再读一遍这一步在问什么。',
    reveals: e.reveals || []
  };
}

/* 生成 3 个与正确答案不同、又都在数量级上的干扰项 */
function numWrongs(v, extra) {
  const cands = shuffleAll([
    v * 10, v * 2, v + 10, v + 100, v - 10, v + 1,
    Math.round(v / 10), v * 100
  ].concat(extra || []));
  const out = [];
  cands.forEach(x => {
    if (out.length >= 3) return;
    if (!Number.isInteger(x) || x <= 0 || x === v || out.includes(x)) return;
    out.push(x);
  });
  let k = 1;
  while (out.length < 3) {
    const c = v + k * 7;
    if (c !== v && !out.includes(c)) out.push(c);
    k++;
  }
  return out;
}
/* 三个文字型干扰项必须与正确项不同 */
function textWrongs(correct, list) {
  const c = String(correct);
  const out = [];
  list.forEach(x => {
    const s = String(x);
    if (out.length < 3 && s !== c && !out.includes(s)) out.push(s);
  });
  let k = 1;
  while (out.length < 3) {
    const s = c + '？'.repeat(k);
    if (!out.includes(s)) out.push(s);
    k++;
  }
  return out;
}
function S2(q, correct, wrongs, extra) { return S(q, correct, textWrongs(correct, wrongs), extra); }

/* 脱式计算：运算顺序 */
{
  unit: '除法', kp: '运算顺序',
  gen() {
    const v = pick([1, 2, 3]);
    const steps = [];
    let text = '', answer = 0, factList = [];
    if (v === 1) {
      const c = randInt(11, 19);
      let q = randInt(11, 30);
      /* 商和除数不能相等，否则「b ÷ c 等于多少」的题干里就带着答案了 */
      while (q === c) q = randInt(11, 30);
      const b = c * q, a = randInt(11, 60);
      answer = a * q;
      text = `计算 ${a} × (${b} ÷ ${c})，结果是多少？`;
      factList = [`算式是 ${a} × (${b} ÷ ${c})`, '有括号，先算括号里的'];
      steps.push(S2('先算哪一步？', `先算括号里的 ${b} ÷ ${c}`,
        [`先算 ${a} × ${b}`, `先算 ${a} × ${c}`, `先算 ${b} × ${c}`],
        { ok: '对！有括号就先算括号里的。', no: '有括号，先算括号里面的。' }));
      steps.push(S2(`${b} ÷ ${c} 等于多少？`, q, numWrongs(q),
        { ok: `对！${b} ÷ ${c} = ${q}。`, no: `算一算 ${b} ÷ ${c}，等于 ${q}。` }));
      steps.push(S2(`再接下去该算什么？`, `${a} × ${q}`,
        [`${a} + ${q}`, `${a} ÷ ${q}`, `${a} − ${q}`],
        { ok: `对！原式变成 ${a} × ${q}。`, no: `括号算完后，剩下的是 ${a} 乘 ${q}。` }));
    } else if (v === 2) {
      const b = randInt(11, 19);
      let q = randInt(11, 30);
      while (q === b) q = randInt(11, 30);
      const a = b * q, c = randInt(11, 40);
      answer = q * c;
      text = `计算 ${a} ÷ ${b} × ${c}，结果是多少？`;
      factList = [`算式是 ${a} ÷ ${b} × ${c}`, '只有乘除，同级运算从左往右'];
      steps.push(S2('只有乘除法，应该按什么顺序算？', '从左往右，先算 ' + a + ' ÷ ' + b,
        [`先算 ${b} × ${c}`, `先算 ${a} × ${c}`, `先算 ${a} × ${b}`],
        { ok: '对！只有乘除，同级运算从左往右。', no: '乘除法是同级运算，从左往右依次算。' }));
      steps.push(S2(`${a} ÷ ${b} 等于多少？`, q, numWrongs(q),
        { ok: `对！${a} ÷ ${b} = ${q}。`, no: `算一算 ${a} ÷ ${b}，等于 ${q}。` }));
      steps.push(S2(`再接下去该算什么？`, `${q} × ${c}`,
        [`${q} + ${c}`, `${q} ÷ ${c}`, `${q} − ${c}`],
        { ok: `对！原式变成 ${q} × ${c}。`, no: `前一步得 ${q}，再乘 ${c}。` }));
    } else {
      const b = randInt(11, 25), c = randInt(3, 9);
      const m = b * c, a = randInt(20, 90);
      answer = a + m;
      text = `计算 ${a} + ${b} × ${c}，结果是多少？`;
      factList = [`算式是 ${a} + ${b} × ${c}`, '没有括号时先算乘除，再算加减'];
      steps.push(S2('算式里有加号也有乘号，应该先算哪一步？', `先算 ${b} × ${c}`,
        [`从左往右先算 ${a} + ${b}`, `先算 ${a} × ${c}`, `先算 ${a} + ${c}`],
        { ok: '对！先乘除、后加减，所以先算乘法。', no: '没有括号的时候，先算乘除，再算加减。' }));
      steps.push(S2(`${b} × ${c} 等于多少？`, m, numWrongs(m),
        { ok: `对！${b} × ${c} = ${m}。`, no: `算一算 ${b} × ${c}，等于 ${m}。` }));
      steps.push(S2(`再接下去该算什么？`, `${a} + ${m}`,
        [`${a} − ${m}`, `${a} × ${m}`, `${m} − ${a}`],
        { ok: `对！原式变成 ${a} + ${m}。`, no: `乘法算完后，再算 ${a} 加 ${m}。` }));
    }
    return {
      tag: '四上 · 脱式计算',
      text, facts: factList, steps, answer, unit: '',

      wrongTip: '记牢：有括号先算括号；只有乘除时从左往右。'

  }

/* 平均数正向：身高 */
{
  unit: '平均数', kp: '求平均数',
  gen() {
    const n = 5;
    const SC = pick([
      { item: '身高', unit: '厘米', lo: 128, hi: 146, spread: 10, grp: '四（1）班第一小组' },
      { item: '1 分钟跳绳成绩', unit: '下', lo: 120, hi: 160, spread: 12, grp: '四（1）班跳绳小组' },
      { item: '体重', unit: '千克', lo: 26, hi: 45, spread: 5, grp: '四（1）班第一小组' },
      { item: '1 分钟仰卧起坐成绩', unit: '个', lo: 26, hi: 45, spread: 6, grp: '四（1）班体测小组' },
      { item: '跳远成绩', unit: '厘米', lo: 120, hi: 165, spread: 14, grp: '四（1）班第一小组' }
    ]);
    const A = randInt(SC.lo, SC.hi);
    const total = A * n;
    /* 生成数据：如果某个数据恰好等于平均数，答案就会从加数里露出来，必须重取 */
    let hs = [];
    for (let t = 0; t < 60; t++) {
      hs = []; let rem = total;
      for (let i = 0; i < n - 1; i++) {
        const v = randInt(A - SC.spread, A + SC.spread);
        hs.push(v); rem -= v;
      }
      hs.push(rem);
      if (hs.every(v => v !== A && v >= A - SC.spread * 2 && v <= A + SC.spread * 2)) break;
    }
    const it = SC.item, u = SC.unit;
    const avgWord = it.indexOf('成绩') >= 0 ? '平均成绩' : '平均' + it;
    return {
      tag: '四上 · 求平均数',
      text: `${SC.grp} ${n} 位同学的${it}分别是 ${hs.join(` ${u}、`)} ${u}。这个小组同学的${avgWord}是多少${u}？`,
      facts: [`一共 ${n} 位同学`, `${it}分别是 ${hs.join('、')} ${u}`],
      steps: [
        S2(`「${avgWord}」是什么意思？`, `把${it}的总和平均分给每个人`,
          [`${it}最大的那一个`, `${it}最小的那一个`, `${it}的总和`],
          { ok: '对！平均数就是把总数平均分。', no: `${avgWord} = ${it}的总和 ÷ 人数。` }),
        S2(`要求${avgWord}，必须知道什么？`, `${it}的总和与总人数`,
          [`最大的${it}`, `最小的${it}`, '排第几'],
          { ok: '对！平均数 = 总数 ÷ 总份数。', no: '回忆一下：平均数 = 总数 ÷ 总份数。' }),
        S2(`${it}的总和是多少${u}？该用哪个算式？`, hs.join(' + '),
          [`${A} × ${n}`, `${Math.max(...hs)} − ${Math.min(...hs)}`, `${hs[0]} + ${hs[1]}`],
          { ok: `对！${hs.join(' + ')} = ${total} ${u}。`, no: `求总和就是把每个人的${it}都加起来。` }),
        S2(`${it}总和 ${total} ${u}，一共 ${n} 人，求${avgWord}该用哪个算式？`, `${total} ÷ ${n}`,
          [`${total} × ${n}`, `${total} − ${n}`, `${total} + ${n}`],
          { ok: `对！用 ${total} ÷ ${n}。算出来填进下面的框吧！`, no: '平均数 = 总数 ÷ 总份数。' })
      ],
      answer: A, unit: u,
      praise: '你掌握了「总数 ÷ 份数 = 平均数」！',
      wrongTip: `先求${it}的总和 ${total} ${u}，再除以人数 ${n}，得 ${A} ${u}。`
    };
  }

/* 平均数变化：改一个数 */
{
  unit: '平均数', kp: '平均数的变化',
  gen() {
    /* 答案就是"被改动前的那个数"，别让它和题面里出现的其它数字撞上 */
    let n, A1, diff, A2, newVal, drop, orig;
    do {
      n = randInt(5, 9);
      A1 = randInt(14, 32);
      diff = randInt(1, 4);
      A2 = A1 - diff;
      newVal = randInt(1, 6);
      drop = n * diff;
      orig = newVal + drop;
    } while (orig === A1 || orig === A2 || orig === n || orig === diff || orig === newVal || orig === drop);
    const who = pick(SC_NAME);
    const sc = pick([
      `${n} 个数的平均数是 ${A1}。如果把其中一个数改成 ${newVal}，这时这 ${n} 个数的平均数就变成了 ${A2}。这个被改动的数原来是多少？`,
      `${who}在算 ${n} 个数的平均数时，把其中一个数改成了 ${newVal}，平均数就从 ${A1} 变成了 ${A2}。被改动的那个数原来是多少？`,
      `老师给 ${who}批改作业：${n} 个数的平均数原本是 ${A1}，把其中一个数改成 ${newVal} 之后，平均数变成了 ${A2}。原来那个数是多少？`,
      `一组 ${n} 个数，平均数是 ${A1}。其中有一个数被 ${who}改成了 ${newVal}，平均数就掉到了 ${A2}。被改动的数原来是多少？`
    ]);
    return {
      tag: '四上 · 平均数的变化',
      text: sc,
      facts: [`原来 ${n} 个数的平均数是 ${A1}`, `改过之后平均数是 ${A2}`],
      steps: [
        S2('平均数从 ' + A1 + ' 变成 ' + A2 + '，说明总数怎么样了？', '总数变小了',
          ['总数变大了', '总数没有变', '总数变成了 ' + newVal],
          { ok: '对！平均数小了，总数一定也小了。', no: '平均数变小，说明总和也变小了。' }),
        S2(`原来的总数是多少？`, n * A1, numWrongs(n * A1, [A1, n * A2, n * A1 * 2]),
          { ok: `对！${A1} × ${n} = ${n * A1}。`, no: `平均数乘个数：${A1} × ${n}。` }),
        S2(`现在的总数是多少？`, n * A2, numWrongs(n * A2, [A2, n * A1, n * A2 * 2]),
          { ok: `对！${A2} × ${n} = ${n * A2}。`, no: `现在的平均数 ${A2} 乘 ${n}。` }),
        S2(`总数少了 ${n * A1} − ${n * A2} = ${drop}，而被改后的数是 ${newVal}。求原来的数该用哪个算式？`, `${newVal} + ${drop}`,
          [`${newVal} − ${drop}`, `${drop} − ${newVal}`, `${newVal} × ${drop}`],
          { ok: `对！用 ${newVal} + ${drop}。算出来填进下面的框吧！`, no: `改小了多少，就要加回去多少。` })
      ],
      answer: orig, unit: '',
      praise: '你抓住了「平均数变了，其实是总数变了」！',
      wrongTip: `原总数 ${n * A1}，新总数 ${n * A2}，少了 ${drop}。原来那个数 = ${newVal} + ${drop} = ${orig}。`
    };
  }
},

        S2(`第 1 ${q}用了 2 个，后面还有 ${n - 1} ${q}、每${q}添 1 个。求一共几个${gg}，该用哪个算式？`, `2 + ${n - 1}`,

/* =========================================================
   思维专项（按单元/题型分布）
   ① 分类讨论 —— 一种情况不够，要把可能的情况都想到
   ② 审题筛选 —— 判断哪个条件多余 / 还缺哪个条件
   ③ 错中求解 —— 从算错的结果倒推回正确的答案
   ========================================================= */

/* ---------- ① 分类讨论 · 图形：等腰三角形的一个内角 ---------- */
{
  unit: '图形', kp: '分类讨论·等腰三角形',
  gen() {
    let a;
    /* a=60 时答案 180−2a 也等于 60，会和题面给的 60° 撞上 */
    do { a = randInt(10, 40) * 2; } while (a === 60);
    const apex = (180 - a) / 2;         /* a 当顶角 → 底角 */
    const baseApex = 180 - 2 * a;       /* a 当底角 → 顶角（a<90，结果为正） */
    const answer = baseApex;
    const who = pick(SC_NAME);
    const sc = pick([
      `一个等腰三角形的一个内角是 ${a}°。${who}说：「这个角一定是顶角。」他的想法对吗？如果这个角是底角，那么这个三角形的顶角是多少度？`,
      `一个等腰三角形里有一个角是 ${a}°，有人认为它的顶角就是 ${a}°。他的判断对吗？如果 ${a}° 其实是底角，顶角应该是多少度？`,
      `做练习时，题目给出「一个等腰三角形的一个内角是 ${a}°」。${who}直接把这个角当成了顶角。如果它其实是底角，顶角是多少度？`,
      `一个等腰三角形的一个内角是 ${a}°。${who}说：「不用分情况，它一定是顶角。」如果这个角是底角，那么顶角是多少度？`
    ]);
    return {
      tag: '四上 · 分类讨论（等腰三角形）',
      text: sc,
      facts: [`一个内角是 ${a}°`, '等腰三角形两个底角相等', '三角形内角和是 180°'],
      steps: [
        S2(`等腰三角形的一个内角是 ${a}°，它可能是哪个角？`, '可能是顶角，也可能是底角',
          ['一定是顶角', '一定是底角', '一定是直角'],
          { ok: '对！题目只给了一个角，没说是哪个角，两种情况都要想到。', no: '题目没告诉我们这个角在哪里。等腰三角形只有三个角，它可能是顶角，也可能是底角。' }),
        S2(`先看第一种情况：如果这个角是顶角，两个底角一共是多少度？`, 180 - a, numWrongs(180 - a, [a, 2 * a, apex]),
          { ok: `对！180 − ${a} = ${180 - a}°，两个底角各是 ${apex}°。`, no: `内角和 180° 减去顶角 ${a}°。` }),
        S2(`再看第二种情况：如果这个角是底角，另一个底角也是 ${a}°。两个底角一共是多少度？`, 2 * a, numWrongs(2 * a, [a, 180 - a, 2 * a + 10]),
          { ok: `对！两个底角一共 ${a} × 2 = ${2 * a}°。`, no: '两个底角相等，都是 ${a}°。'.replace('${a}', a) }),
        S2(`这时顶角是多少度？该用哪个算式？`, `180 − ${2 * a}`,
          [`180 − ${a}`, `180 + ${2 * a}`, `360 − ${2 * a}`],
          { ok: `对！用 180 − ${2 * a}。算出来填进下面的框里吧！`, no: '内角和减去两个底角，剩下的就是顶角。' })
      ],
      answer, unit: '°',
      praise: '你没有急着下结论，而是把两种情况都算了一遍——这就是四年级最重要的思维！',
      wrongTip: `${a}° 当顶角时底角是 ${apex}°；当底角时顶角是 180 − ${a}×2 = ${baseApex}°。`
    };
  }
},

/* ---------- ① 分类讨论 · 图形：等腰三角形的两条边 ---------- */
{
  unit: '图形', kp: '分类讨论·两边定腰',
  gen() {
    const small = randInt(3, 9);
    const big = randInt(2 * small + 1, 2 * small + 12);
    const flip = Math.random() < 0.5;
    const x = flip ? big : small;
    const y = flip ? small : big;
    const answer = 2 * big + small;     /* 只有「长边作腰」这一种情况成立 */
    const who = pick(SC_NAME);
    const sc = pick([
      `一个等腰三角形的两条边分别是 ${x} 厘米和 ${y} 厘米。它的周长是多少厘米？`,
      `一个等腰三角形风筝的两条边分别是 ${x} 厘米和 ${y} 厘米。做这个风筝的边框一共需要多少厘米？`,
      `用竹条做一个等腰三角形的三角旗，量得两条边分别是 ${x} 厘米和 ${y} 厘米。一共要用多少厘米竹条？`,
      `${who}要做等腰三角形的框架，两条边分别是 ${x} 厘米和 ${y} 厘米。围成这个框架需要多少厘米铁丝？`,
      `一个等腰三角形的一条边是 ${x} 厘米，另一条边是 ${y} 厘米。${who}想知道它的周长是多少厘米。`
    ]);
    return {
      tag: '四上 · 分类讨论（两边定腰）',
      text: sc,
      facts: [`两条边分别是 ${x} 厘米和 ${y} 厘米`, '等腰三角形的两条腰相等', '任意两边之和大于第三边'],
      steps: [
        S2('题目只说了这是等腰三角形，这两条边哪一条是腰还不确定。该怎么办？', '把两种情况都试一试',
          ['随便选一条当腰', '一定是长的那条当腰', '至少要再量一次'],
          { ok: '对！谁当腰还说不定，两种都要试，试完还要看能不能围成三角形。', no: '只知道两条边，无法确定谁是腰——所以要分情况讨论，再用「两边之和大于第三边」筛掉不可能的那种。' }),
        S2(`情况一：假设 ${small} 厘米是腰，三条边就是 ${small}、${small}、${big}。${small} + ${small} = ${2 * small}，比 ${big} 怎么样？能围成三角形吗？`, `比 ${big} 小，围不成`,
          [`比 ${big} 大，能围成`, `和 ${big} 相等，能围成`, `无法判断`],
          { ok: `对！两条短边加起来才 ${2 * small}，够不到 ${big}，围不成三角形，这种情况要排除。`, no: `三角形要求任意两边之和大于第三边。${small} + ${small} = ${2 * small}，小于 ${big}，围不成。` }),
        S2(`情况二：假设 ${big} 厘米是腰，三条边就是 ${big}、${big}、${small}。${small} + ${big} = ${small + big}，比 ${big} 大吗？能围成吗？`, `比 ${big} 大，能围成`,
          [`比 ${big} 小，围不成`, `和 ${big} 相等，围不成`, `无法判断`],
          { ok: `对！${small} + ${big} = ${small + big} > ${big}，能围成三角形，所以只有这一种情况成立。`, no: `${small} + ${big} = ${small + big}，大于 ${big}，满足条件，能围成。` }),
        S2('那么周长该用哪个算式？', `${big} × 2 + ${small}`,
          [`${small} × 2 + ${big}`, `(${small} + ${big}) × 2`, `${big} + ${small}`],
          { ok: `对！两条腰各 ${big} 厘米，再加底边 ${small} 厘米。`, no: '两条腰都是 ${big} 厘米，再加底边 ${small} 厘米。' })
      ],
      answer, unit: '厘米',
      praise: '你既分了情况，又用三边关系筛掉了不可能的答案，思路非常完整！',
      wrongTip: `${small}、${small}、${big} 围不成（${2 * small} < ${big}）；只有 ${big}、${big}、${small} 成立，周长 = ${big}×2+${small} = ${answer} 厘米。`
    };
  }
},

/* ---------- ① 分类讨论 · 大数：近似数反推最大/最小 ---------- */
{
  unit: '大数', kp: '分类讨论·近似数反推',
  gen() {
    const n = randInt(11, 98);
    const askMax = Math.random() < 0.5;
    const maxNum = n * 10000 + 4999;
    const minNum = (n - 1) * 10000 + 5000;
    const answer = askMax ? maxNum : minNum;
    const steps = askMax ? [
      S2(`一个数省略万位后面的尾数约是 ${n} 万。得到 ${n} 万有两种途径：一种是"四舍"，一种是"五入"。要取最大的数，该看哪一种？`, '看"四舍"的那种',
        ['看"五入"的那种', '两种都一样大', '两种都不能取'],
        { ok: '对！要最大，就让千位尽量大但还够不上"进 1"，也就是"四舍"。', no: '"四舍"是把尾数直接舍掉，原来的数比 ${n} 万大；"五入"是进上来的，原来的数比 ${n} 万小。要最大就找"四舍"。'.replace('${n}', n) }),
      S2('"四舍"的意思是千位上的数不够 5，直接舍去。千位最大能是几？', 4, [5, 9, 3],
        { ok: '对！千位最大是 4，再大就要"进 1"了。', no: '千位满 5 就要向前一位进 1，所以"四舍"时千位最大只能是 4。' }),
      S2('要使这个数最大，千位取 4，那么百位、十位、个位各取几？', '百、十、个位都取 9',
        ['百、十、个位都取 0', '百位取 9，其余取 0', '百、十、个位都取 4'],
        { ok: '对！千位是 4，后面三位全取最大 9。', no: '要让整个数最大，每一位都要取尽可能大的数，所以是 999。' }),
      S2('那么这个最大的数是多少？该用哪个算式？', `${n}0000 + 4999`,
        [`${n}0000 + 5000`, `${n + 1}0000 + 4999`, `${n}0000 + 999`],
        { ok: `对！用 ${n}0000 + 4999。算出来填进下面的框里吧！`, no: `万位是 ${n}，后面最大是 4999。` })
    ] : [
      S2(`一个数省略万位后面的尾数约是 ${n} 万。要取最小的数，该看"四舍"还是"五入"？`, '看"五入"的那种',
        ['看"四舍"的那种', '两种都一样大', '两种都不能取'],
        { ok: '对！"五入"是进上来才得到 ${n} 万的，原来的数比 ${n} 万小，所以它最小。'.replace('${n}', n), no: '"五入"是千位满 5、向前进 1 才变成 ${n} 万的，说明原来的数比 ${n} 万小。要最小就找"五入"。'.replace('${n}', n) }),
      S2(`既然是"五入"，说明是万位进 1 之后才得到 ${n} 万。那么原来的万位上是几？`, n - 1, numWrongs(n - 1, [n, n - 2, n + 1]),
        { ok: `对！原来是 ${n - 1} 万，进 1 之后才是 ${n} 万。`, no: `进 1 才变成 ${n} 万，所以原来的万位是 ${n} − 1 = ${n - 1}。` }),
      S2('要使这个数最小，千位至少是几？百位、十位、个位各取几？', '千位取 5，其余三位都取 0',
        ['千位取 4，其余三位都取 0', '千位取 5，其余三位都取 9', '千位取 9，其余三位都取 0'],
        { ok: '对！千位刚好满 5 就能进 1，后面三位全取最小的 0。', no: '"五入"要求千位至少是 5；要让整个数最小，后面三位取 0。' }),
      S2('那么这个最小的数是多少？该用哪个算式？', `${n - 1}0000 + 5000`,
        [`${n - 1}0000 + 4999`, `${n}0000 + 5000`, `${n - 1}0000 + 500`],
        { ok: `对！用 ${n - 1}0000 + 5000。算出来填进下面的框里吧！`, no: `万位是 ${n - 1}，后面最小是 5000。` })
    ];
    const who = pick(SC_NAME);
    const sc = pick([
      { t: `一个数省略万位后面的尾数约是 ${n} 万。这个数${askMax ? '最大' : '最小'}是多少？`, h: '原数' },
      { t: `某市一年的游客量省略万位后面的尾数约是 ${n} 万人次。实际人数${askMax ? '最多' : '最少'}可能是多少人次？`, h: '游客量' },
      { t: `${who}用四舍五入把一个数省略万位后面的尾数，得到 ${n} 万。这个数${askMax ? '最大' : '最小'}是多少？`, h: '原数' },
      { t: `一本书的字数省略万位后面的尾数约是 ${n} 万字。实际字数${askMax ? '最多' : '最少'}可能是多少？`, h: '字数' },
      { t: `一个数精确到万位约是 ${n} 万。它原来的数${askMax ? '最大' : '最小'}是多少？`, h: '原数' }

    return {
      tag: '四上 · 分类讨论（近似数反推）',
      text: sc.t,
      facts: [`约是 ${n} 万（省略万位后面的尾数）`, '求近似数用"四舍五入"'],
      steps, answer, unit: '',
      praise: '你想到了"四舍"和"五入"两条路，还会挑出符合要求的那一条！',

        ? `"四舍"时最大：万位 ${n}，后面取 4999，得 ${maxNum}。`
        : `"五入"时最小：万位 ${n - 1}，后面取 5000，得 ${minNum}。`
    };
  }
},

/* ---------- ① 分类讨论 · 探索：剪绳子与两端不种 ---------- */
{
  unit: '探索', kp: '分类讨论·两端都不种',

    const gap = randInt(4, 10);

    const length = gap * segs;

    const kind = pick([
      { what: '一条长 ' + length + ' 米的走廊', put: '放一盆花', how: '两端都是门口，不能放' },
      { what: '一条长 ' + length + ' 米的甬路', put: '栽一棵树', how: '两端都要留出路口，不能栽' },
      { what: '一条长 ' + length + ' 米的阳台', put: '摆一盆花', how: '两端都靠墙，摆不下' },
      { what: '一段长 ' + length + ' 米的站台', put: '装一盏地灯', how: '两端都是进出通道，不能装' },
      { what: '一面长 ' + length + ' 米的围墙', put: '挂一幅画', how: '两端都是柱子，不能挂' },
      { what: '一条长 ' + length + ' 米的长廊', put: '挂一盏灯笼', how: '两端是出入口，不能挂' }
    ]);
    return {
      tag: '四上 · 分类讨论（两端都不种）',
      text: `${kind.what}，现在要在它的一边每隔 ${gap} 米${kind.put}。${kind.how}。一共要${kind.put}多少处？`,
      facts: [`全长 ${length} 米`, `每隔 ${gap} 米一处`, kind.how],
      steps: [
        S2('先把这条路的间隔数算出来，被分成了几段？该用哪个算式？', `${length} ÷ ${gap}`,
          [`${length} + ${gap}`, `${length} − ${gap}`, `${length} × ${gap}`],
          { ok: `对！${length} ÷ ${gap} = ${segs} 段。`, no: `求 ${length} 里面有几个 ${gap}，用除法。` }),
        S2('一端种、两端都种、两端都不种，算出来的棵数是不一样的。这道题属于哪种？', '两端都不种',
          ['两端都种', '只种一端', '围着种一圈'],
          { ok: '对！题目说了两端都不能放，属于"两端都不种"。', no: '题目里写了"两端都不能"，所以是两端都不种。' }),
        S2(`两端都不种的时候，处数和段数是什么关系？`, '处数比段数少 1',

          { ok: `对！末端那一段没有起点，所以要比段数少 1。`, no: '两端都不种，首尾各少一个，所以处数 = 段数 − 1。' }),
        S2('那么求处数该用哪个算式？', `${segs} − 1`,
          [`${segs} + 1`, `${segs} × 2`, `${segs} ÷ 2`],
          { ok: '对！段数减 1。算出来填进下面的框里吧！', no: `段数是 ${segs}，两端都不种要减 1。` })
      ],
      answer, unit: '处',
      praise: '你分清了"两端都种"和"两端都不种"，差的就是那 1！',
      wrongTip: `段数 ${length}÷${gap}=${segs}；两端都不种要减 1，所以是 ${answer} 处。`
    };
  }
},

/* ---------- ② 审题筛选 · 除法：多余条件 ---------- */
{
  unit: '除法', kp: '审题·多余条件',

/* ---------- ③ 错中求解 · 除法：除数看错 ---------- */
{
  unit: '除法', kp: '错中求解·除数看错',
  gen() {
    const dRight = randInt(12, 42);
    let Q;
    do { Q = randInt(5, 30); } while (Q === dRight);
    const R = randInt(1, dRight - 1);
    const A = dRight * Q + R;
    /* 看错后的商/余数不能和正确答案撞上，否则步骤里就把答案说破了 */
    let dWrong = 0, q = 0, r = 0;
    for (let step = 0; step < 40 && !dWrong; step++) {
      const off = (step % 2 === 0 ? 1 : -1) * (5 + Math.floor(step / 2));
      const cand = dRight + off;
      if (cand === dRight || cand < 11 || cand > 49 || cand === Q) continue;
      const qq = Math.floor(A / cand), rr = A % cand;
      if (qq < 1 || qq === Q || rr === Q) continue;
      dWrong = cand; q = qq; r = rr;
    }
    if (!dWrong) { dWrong = dRight + 5; q = Math.floor(A / dWrong); r = A % dWrong; }
    const name = pick(['小明', '小华', '琪琪', '小刚', '淘淘', '阳阳', '果果', '聪聪']);
    const sc = pick([
      `${name}在计算一个除法算式时，把除数 ${dRight} 看成了 ${dWrong}，算出的商是 ${q}，余数是 ${r}。这个除法算式正确的商是多少？`,
      `检查作业时，老师发现${name}把除数 ${dRight} 看成了 ${dWrong}，算出的商是 ${q}，余数是 ${r}。正确的商应该是多少？`,
      `${name}做题时看错了数：本该除以 ${dRight}，他按成了 ${dWrong}，得到商 ${q}、余数 ${r}。正确的商是多少？`,
      `计算时${name}把除数 ${dRight} 写成了 ${dWrong}，算出的商是 ${q}，余数是 ${r}。这道题正确的商是多少？`
    ]);
    return {
      tag: '四上 · 错中求解（除数看错）',
      text: sc,
      facts: [`看错的除数是 ${dWrong}`, `算出的商是 ${q}，余数是 ${r}`, '真正的除数是 ' + dRight],
      steps: [
        S2('要求正确的商，先要知道什么？', '被除数是多少',
          ['他一共算了几道题', '余数是多少', '正确的商是多少'],
          { ok: '对！被除数从头到尾没有变过，先把它求出来。', no: '先把"被除数"求出来——被除数一直没变，是唯一能把错误和正确连起来的东西。' }),
        S2(`虽然除数看错了，但被除数没变。怎么用看错的结果把被除数求出来？`, `${dWrong} × ${q} + ${r}`,
          [`${dWrong} × ${q} − ${r}`, `${dRight} × ${q} + ${r}`, `${dWrong} ÷ ${q} + ${r}`],
          { ok: `对！"商 × 除数 + 余数 = 被除数"，要用他看错的那个除数。`, no: '被除数 = 商 × 除数 + 余数。这里要代他实际用的除数 ${dWrong}。'.replace('${dWrong}', dWrong) }),
        S2(`那么被除数是多少？`, A, numWrongs(A, [dWrong * q, dRight * Q, A + r]),
          { ok: `对！被除数是 ${A}。`, no: `${dWrong} × ${q} + ${r} = ${A}。` }),
        S2(`现在用真正的除数 ${dRight} 去除 ${A}，商该用哪个算式？`, `${A} ÷ ${dRight}`,
          [`${A} ÷ ${dWrong}`, `${A} × ${dRight}`, `${dRight} ÷ ${A}`],
          { ok: `对！用 ${A} ÷ ${dRight}。算出来填进下面的框里吧！`, no: `既然知道被除数是 ${A}、除数是 ${dRight}，就再除一次。` })
      ],
      answer: Q, unit: '',
      praise: '你想到用"错的结果"先把被除数救回来，再重新算一遍——很聪明！',
      wrongTip: `被除数 = ${dWrong}×${q}+${r} = ${A}；正确的商 = ${A}÷${dRight} = ${Q}。`
    };
  }
},

             rightAvg === rightVal || rightAvg === wrongVal ||

    const name = pick(['小红', '小明', '兵兵', '小丽', '朵朵', '小雨']);
    const sc = pick([
      `${name}在计算 ${n} 个数的平均数时，把其中的 ${rightVal} 看成了 ${wrongVal}，算出的平均数是 ${wrongAvg}。正确的平均数是多少？`,

      `一批 ${n} 个数据里有 ${rightVal}，${name}误写成了 ${wrongVal}，算出的平均数是 ${wrongAvg}。正确的平均数是多少？`

    return {

    };
  }

/* =========================================================
   状态
   ========================================================= */
let score = 0, combo = 0, perfectCount = 0;
let scoreVisible = true;
let currentTab = 'practice';
let timerEnabled = false;
const TIME_LIMIT = 90;
let timerRemaining = 0, timerInterval = null;

const SESSION_GOAL = 10;
let doneCount = 0;
let goalCelebrated = false;

let selectedUnits = [];
let questions = [];       /* [{tpl, problem, state}] */
let current = 0;
let tplQueue = [];
const seenFingerprints = new Set();

let wrongBook = LS.get('wrongBook', []);
let history = LS.get('history', []);

const plain = t => String(t).replace(/<[^>]*>/g, '');

/* =========================================================
   出题：按所选单元取模板 → 轮转不扎堆 → 指纹去重
   ========================================================= */
function poolTemplates() {
  if (selectedUnits.length === 0) return [];
  return problemTemplates.filter(t => selectedUnits.indexOf(t.unit) >= 0);
}

function nextTemplate(pool) {
  tplQueue = tplQueue.filter(t => pool.indexOf(t) >= 0);
  if (tplQueue.length === 0) tplQueue = shuffleAll(pool);
  return tplQueue.pop();
}

function makeProblem(tpl) {
  let p = null, key = '';
  for (let i = 0; i < 16; i++) {
    p = tpl.gen();
    key = tpl.unit + '|' + tpl.kp + '|' + p.text;
    if (!seenFingerprints.has(key)) break;
  }
  if (seenFingerprints.size > 900) seenFingerprints.clear();
  seenFingerprints.add(key);
  return p;
}

function makeState(problem) {
  return {
    stepIdx: 0,
    chosen: problem.steps.map(() => null),
    tried: problem.steps.map(() => []),
    expanded: problem.steps.map(() => false),
    solved: false,
    hadWrong: false,
    timedOut: false,
    recorded: false,
    timeUsed: 0,
    wrongAnswerRecorded: false
  };
}

function newQuestion(tpl) {
  const problem = makeProblem(tpl);
  return { tpl, problem, state: makeState(problem) };
}

function appendQuestion() {
  const pool = poolTemplates();
  if (pool.length === 0) return false;
  questions.push(newQuestion(nextTemplate(pool)));
  return true;
}

function buildSession() {
  redoState = null;                 /* 只要重新生成正常题集，就退出错题重做 */
  questions = []; tplQueue = []; current = 0;
  const pool = poolTemplates();
  if (pool.length === 0) return;
  const n = Math.min(6, pool.length);
  for (let i = 0; i < n; i++) appendQuestion();
  while (questions.length < 6) appendQuestion();
}

/* =========================================================
   分单元选择
   ========================================================= */
function loadUnits() {
  const VCUR = 2;
  const v = LS.get('unitsV', 0);
  const saved = LS.get('units', null);
  if (v < VCUR) {
    /* v2：不再默认「全部单元」，改成一进来就是「选择单元」，由用户自己挑（可多选） */
    selectedUnits = [];
    LS.set('units', selectedUnits);
    LS.set('unitsV', VCUR);
    return;
  }
  selectedUnits = UNITS.map(u => u.key).filter(k => (saved || []).indexOf(k) >= 0);
}
function saveUnits() { LS.set('units', selectedUnits); }
function countByUnit(key) { return problemTemplates.filter(t => t.unit === key).length; }

function renderUnitChips() {
  const wrap = $('unitChips');
  wrap.innerHTML = UNITS.map(u => {
    const on = selectedUnits.indexOf(u.key) >= 0;
    return `<button class="unit-chip${on ? ' on' : ''}" data-unit="${u.key}"
      aria-pressed="${on ? 'true' : 'false'}">
      <span class="chip-tick">${on ? '✓' : '○'}</span>
      <span>${u.icon} ${u.name}<span class="chip-sub">${u.sub} · ${countByUnit(u.key)} 类题</span></span>
    </button>`;
  }).join('');
  wrap.querySelectorAll('[data-unit]').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.unit;
      const i = selectedUnits.indexOf(k);
      if (i >= 0) selectedUnits.splice(i, 1);
      else selectedUnits.push(k);
      selectedUnits = UNITS.map(u => u.key).filter(x => selectedUnits.indexOf(x) >= 0);
      saveUnits();
      SFX.click();
      buildSession();
      renderAll();
    });
  });
}

/* 三处状态一起同步：按钮文案 / 单元标签 / 练习区空状态 */
function syncUnitUI() {
  const total = selectedUnits.length;
  let label;
  if (total === 0) label = '选择单元';
  else if (total === UNITS.length) label = '全部单元';
  else if (total === 1) label = UNIT_MAP[selectedUnits[0]].name.replace(/^第[一二三四五六七八九]单元 · /, '');
  else label = `已选 ${total} 个单元`;
  $('unitLabel').textContent = label;

  document.querySelectorAll('#unitChips [data-unit]').forEach(btn => {
    const on = selectedUnits.indexOf(btn.dataset.unit) >= 0;
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    const tick = btn.querySelector('.chip-tick');
    if (tick) tick.textContent = on ? '✓' : '○';
  });

  const sum = $('unitSummary');
  if (total === 0) {
    sum.className = 'unit-summary warn';
    sum.innerHTML = '还没有选单元。点上面的单元按钮选一个，就会出现题目啦（可以多选）。';
  } else {
    sum.className = 'unit-summary';
    const kinds = poolTemplates().length;
    const names = selectedUnits.map(k => UNIT_MAP[k].name.replace(/^第[一二三四五六七八九]单元 · /, '')).join('、');
    sum.innerHTML = `已选 <b>${total}</b> 个单元 · 共 <b>${kinds}</b> 类题目` +
      (total === UNITS.length ? '（全部单元）' : `：${names}`);
  }

  const noUnit = total === 0;
  const show = !noUnit || redoActive();      /* 错题重做时，即使一个单元没选也要显示练习区 */
  $('practiceEmpty').style.display = show ? 'none' : 'block';
  $('practiceBody').style.display = show ? 'block' : 'none';
  $('goalBar').style.display = (show && !pkMode) ? 'block' : 'none';
}

/* =========================================================
   分数
   ========================================================= */
function addScore(p, bonus) {
  if (!scoreVisible) return;
  score += p;
  const el = $('scoreValue');
  if (el) {
    el.textContent = score;
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  }
  floatScore('+' + p, bonus);
}
function resetCombo() {
  combo = 0;
  const el = $('comboValue'); if (el) el.textContent = combo;
}
function incCombo() {
  combo += 1;
  const el = $('comboValue');
  if (el) { el.textContent = combo; el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
}
function incPerfect() {
  perfectCount += 1;
  const el = $('perfectValue');
  if (el) { el.textContent = perfectCount; el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
}
function floatScore(text, bonus) {
  const t = $('scoreValue'); if (!t) return;
  const r = t.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'score-float' + (bonus ? ' bonus' : '');
  el.textContent = text;
  el.style.left = (r.left + r.width / 2) + 'px';
  el.style.top = (r.top - 4) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function renderGoal() {
  if (pkMode) return;                   /* PK 时用比分条代替本轮目标 */
  const pct = Math.min(100, Math.round(doneCount / SESSION_GOAL * 100));
  $('goalFill').style.width = pct + '%';
  $('goalNum').textContent = doneCount >= SESSION_GOAL ? `已完成 ${doneCount} 题 🎉` : `${doneCount} / ${SESSION_GOAL} 题`;
  const bar = $('goalBar');
  if (doneCount >= SESSION_GOAL) {
    bar.classList.add('reached');
    if (!goalCelebrated) {
      goalCelebrated = true;
      SFX.levelup();
      floatScore('🎉 目标达成', true);
    }
  } else {
    bar.classList.remove('reached');
    goalCelebrated = false;
  }
}

/* =========================================================
   计时
   ========================================================= */
function startTimer() {
  stopTimer();
  const bar = $('timerBar');
  if (!bar) return;
  const q = questions[current];
  if (!timerEnabled || currentTab !== 'practice' || !q || q.state.solved) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  timerRemaining = TIME_LIMIT;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerRemaining--;
    updateTimerDisplay();
    if (timerRemaining <= 0) { stopTimer(); handleTimeout(); }
  }, 1000);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay() {
  const bar = $('timerBar'), prog = $('timerProgress'), txt = $('timerText');
  if (!bar || bar.style.display === 'none') return;
  prog.style.width = Math.max(0, timerRemaining / TIME_LIMIT * 100) + '%';
  txt.textContent = timerRemaining + 's';
  bar.classList.toggle('urgent', timerRemaining <= 15);
}
function handleTimeout() {
  const q = questions[current];
  if (!q || q.state.solved) return;
  const st = q.state;
  st.timedOut = true; st.solved = true; st.timeUsed = TIME_LIMIT;
  doneCount++;
  SFX.timeout();
  addWrongRecord(q, {
    stepIdx: st.stepIdx + 1,
    stepQ: '超时未完成',
    wrongChoice: '（超时）',
    correctChoice: q.problem.answer + (q.problem.unit ? ' ' + q.problem.unit : '')
  });
  addHistoryRecord(q, 0, false, TIME_LIMIT);
  render();
  renderWrongBadge();
}

/* =========================================================
   错题 / 历史
   ========================================================= */
function addWrongRecord(q, info) {
  if (redoState) return;          /* 错题重做过程中不再重复记同一道题 */
  const p = q.problem;
  wrongBook.unshift({
    id: uid(),
    qtext: plain(p.text), qtag: p.tag, kp: q.tpl.kp, topic: q.tpl.unit,
    wrongStep: info.stepIdx, wrongStepQ: plain(info.stepQ),
    wrongChoice: plain(info.wrongChoice), correctChoice: plain(info.correctChoice),
    correctAnswer: p.answer, ansUnit: p.unit,
    problem: p,                   /* 整道题原样存下来，这样「重做这道题」能一字不差地重现 */
    timestamp: Date.now()
  });
  if (wrongBook.length > 60) wrongBook = wrongBook.slice(0, 60);
  LS.set('wrongBook', wrongBook);
  renderWrongBadge();
}
function addHistoryRecord(q, pts, perfect, timeUsed) {
  const p = q.problem;
  history.unshift({
    id: uid(),
    qtext: plain(p.text).slice(0, 46) + (plain(p.text).length > 46 ? '…' : ''),
    qtag: p.tag, kp: q.tpl.kp, topic: q.tpl.unit,
    score: pts, perfect, timeUsed,
    timestamp: Date.now()
  });
  if (history.length > 80) history = history.slice(0, 80);
  LS.set('history', history);
}
function renderWrongBadge() {
  const b = $('wrongBadge');
  if (b) b.textContent = wrongBook.length;
}

/* =========================================================
   渲染
   ========================================================= */
function renderAll() {
  syncUnitUI();
  if (redoActive() && questions.length) { render(); return; }   /* 错题重做时只做这一道 */
  if (poolTemplates().length === 0) { stopTimer(); renderGoal(); return; }
  if (questions.length === 0) buildSession();
  if (current >= questions.length) current = questions.length - 1;
  if (current < 0) current = 0;
  render();
}

function render() {
  const q = questions[current];
  if (!q) return;
  const p = q.problem;
  $('tag').textContent = p.tag;
  $('counter').textContent = `第 ${current + 1} / ${questions.length} 题`;
  $('qtext').innerHTML = hl(p.text);
  renderFacts();
  renderPkRace();                 /* PK 显示竞速区，单人自动隐藏 */
  /* 错题重做：显示提示条，并藏掉「换一题」（否则会绕过重做把错题删掉） */
  const rb = $('redoBar');
  if (rb) rb.classList.toggle('on', redoActive());
  const cb = $('changeBtn');
  if (cb) cb.style.display = redoActive() ? 'none' : '';
  if (pkMode) {
    renderPkBar();
    renderNav();
    updateBackBtn();
    stopTimer();
    $('timerBar').style.display = 'none';
    return;
  }
  renderSteps();
  renderAnswer();
  renderNav();
  renderGoal();
  updateBackBtn();
  startTimer();
}

function renderFacts() {
  const q = questions[current]; if (!q) return;
  const p = q.problem, st = q.state;
  const box = $('factsBox');

  if (!p.facts || p.facts.length === 0) { box.style.display = 'none'; return; }
  box.style.display = '';

  const revealed = new Set();
  if (pkMode) {
    /* PK 是同题竞速，条件一次全给，不搞逐步解锁 */
    p.facts.forEach((_, i) => revealed.add(i));
  } else {
    const useReveals = p.steps.some(s => s.reveals && s.reveals.length);
    if (useReveals) {
      p.steps.forEach((s, i) => {
        if (st.stepIdx > i && s.reveals) s.reveals.forEach(f => revealed.add(f));
      });
    } else {
      for (let i = 0; i < Math.min(st.stepIdx, p.facts.length); i++) revealed.add(i);
    }
  }

  const list = $('factsList'), countEl = $('factsCount'), subEl = $('factsSub');
  if (revealed.size === 0) {
    countEl.style.display = 'none';
    subEl.textContent = '完成思考步骤，条件会逐步出现';
    list.innerHTML = `<div class="facts-empty">还没有找到已知条件<br>先完成下面的思考步骤吧 👇</div>`;
    return;
  }
  countEl.style.display = 'inline-block';
  countEl.textContent = `${revealed.size} / ${p.facts.length}`;
  subEl.textContent = pkMode
    ? 'PK 模式 · 条件全部给出，看谁算得快！'
    : (revealed.size === p.facts.length ? '条件已经全部找到，可以用它们列式了' : '已经找到部分条件，继续往下想');
  list.innerHTML = p.facts.map((f, i) => revealed.has(i)
    ? `<div class="fact"><span class="fact-no">${i + 1}</span><span>${hl(f)}</span></div>`
    : `<div class="fact locked"><span class="fact-no">?</span><span class="fact-hidden">待解锁的条件</span></div>`
  ).join('');
}

function renderSteps() {
  const q = questions[current]; if (!q) return;
  const p = q.problem, st = q.state;
  const wrap = $('steps');
  wrap.innerHTML = '';

  p.steps.forEach((s, i) => {
    const el = document.createElement('div');
    el.dataset.step = i;

    if (i < st.stepIdx) {
      el.className = 'step done' + (st.expanded[i] ? ' expanded' : '');
      const pickIdx = st.chosen[i];
      const pickText = (pickIdx !== null && pickIdx !== undefined) ? s.options[pickIdx] : '—';
      el.innerHTML = `
        <div class="step-head">
          <span class="step-num">✓</span>
          <span class="step-q">第 ${i + 1} 步 · ${s.q}</span>
          <span class="step-chevron">▾</span>
        </div>
        <div class="step-body-wrap">
          <div class="step-body">
            <div class="chosen-line">你的选择：<b>${pickIdx !== null ? LETTER[pickIdx] + '. ' + pickText : '—'}</b></div>
            <div class="fb-inline ok">✔ ${s.correct}</div>
          </div>
        </div>`;
      el.querySelector('.step-head').addEventListener('click', () => {
        st.expanded[i] = !st.expanded[i];
        el.classList.toggle('expanded', st.expanded[i]);
        SFX.click();
      });
    } else if (i === st.stepIdx && !st.solved) {
      el.className = 'step active';
      const optsHtml = s.options.map((text, idx) => {
        const isWrong = st.tried[i].indexOf(idx) >= 0;
        return `<button class="opt${isWrong ? ' wrong' : ''}" data-step="${i}" data-opt="${idx}"
                  ${isWrong ? 'disabled' : ''}>
                  <span class="opt-key">${LETTER[idx]}</span>
                  <span class="opt-text">${text}</span>
                </button>`;
      }).join('');
      const fb = st.tried[i].length ? `<div class="fb-inline no">✘ ${s.wrong}</div>` : '';
      el.innerHTML = `
        <div class="step-head">
          <span class="step-num">${i + 1}</span>
          <span class="step-q">${s.q}</span>
        </div>
        <div class="step-body">
          <div class="opts">${optsHtml}</div>
          ${fb}
        </div>`;
    } else {
      el.className = 'step locked';
      el.innerHTML = `
        <div class="step-head">
          <span class="step-num">🔒</span>
          <span class="step-q">第 ${i + 1} 步 · 完成上一步后解锁</span>
        </div>`;
    }
    wrap.appendChild(el);
  });
}

/* 底部导航：题目可以一直往下出，所以用「第 N 题 + 已完成」代替固定圆点 */

  if (pkMode) {

/* =========================================================
   答题区（含大的「下一题」按钮）
   ========================================================= */
function nextBtnHtml() {
  const isLast = current >= questions.length - 1;
  let label = '下一题 →', hint;
  if (redoActive()) {
    label = '继续练习 →';
    hint = redoState.done ? '这道错题已经移出错题本' : '答对这道题，它就会从错题本里消失';
  } else if (pkMode) {
    const last = pkRound >= PK_ROUNDS;
    label = last ? '看结果 🏆' : '下一题 →';
    hint = last ? `${PK_ROUNDS} 题都答完啦，看看谁赢了` : `还剩 ${PK_ROUNDS - pkRound} 题`;
  } else if (isLast) {
    hint = '这是本批最后一题，点一下会自动出新题';
  } else {
    hint = '后面还有 ' + (questions.length - 1 - current) + ' 题';
  }
  return {
    html: `<button class="next-big" id="nextBig"><span>${label}</span></button>
           <div class="next-hint">${hint}</div>`,
    isLast
  };
}

function mountNext() {
  const inner = $('answerInner');
  if (!inner || $('nextBig')) return;
  const wrap = document.createElement('div');
  wrap.className = 'next-wrap';
  wrap.innerHTML = nextBtnHtml().html;
  inner.appendChild(wrap);
  const b = $('nextBig');
  if (b) b.addEventListener('click', goNext);
}

function goNext() {
  if (pkMode) { pkNextRound(); return; }   /* PK 的推进交给竞速流程 */
  SFX.click();
  if (redoActive()) { if (redoState.done) exitRedo(); return; }
  if (current < questions.length - 1) {
    current++;
  } else {
    if (!appendQuestion()) return;
    current = questions.length - 1;
  }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderAnswer() {
  const q = questions[current]; if (!q) return;
  const p = q.problem, st = q.state;
  const card = $('answerCard'), inner = $('answerInner');
  const unitHtml = p.unit ? `<span class="unit">${p.unit}</span>` : '';

  if (st.timedOut) {
    card.classList.remove('locked');
    inner.innerHTML = `
      <div class="answer-hint" style="color:#E63A3A;">⏰ 时间到了！正确答案是 <b>${p.answer}${p.unit ? ' ' + p.unit : ''}</b></div>
      <div class="feedback show no">这道题没能在规定时间内完成，已经记到错题本啦。<br>
        <span class="fb-sub">没关系，我们换一道继续练 👇</span></div>`;
    mountNext();
    return;
  }

  if (st.stepIdx < p.steps.length) {
    card.classList.add('locked');
    const leave = p.steps.length - st.stepIdx;
    inner.innerHTML = `<div class="lock-msg">🔒 完成上面 ${p.steps.length} 个思考步骤后，<br>就可以在这里填写最终答案啦<br><span style="font-size:12.5px;">（还剩 ${leave} 步）</span></div>`;
    return;
  }

  card.classList.remove('locked');
  inner.innerHTML = `
    <div class="answer-hint">✍ 自己算出最后一步的结果，填进来看看！</div>
    <div class="answer-row">
      <span class="answer-label">我的答案：</span>
      <input id="ansInput" type="text" inputmode="decimal" placeholder="?">
      ${unitHtml}
      <button class="btn btn-primary" id="checkBtn">检 查</button>
    </div>
    <div class="feedback" id="feedback"></div>`;

  $('checkBtn').addEventListener('click', check);
  $('ansInput').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });

  if (st.solved) {
    const input = $('ansInput');
    input.value = p.answer;
    input.disabled = true;
    showFb('ok', `✔ 完全正确！答案是 <b>${p.answer}${p.unit ? ' ' + p.unit : ''}</b>。<br><span class="fb-sub">${p.praise}</span>`);
    mountNext();
  }
}

function showFb(type, html) {
  const fb = $('feedback');
  if (!fb) return;
  fb.className = 'feedback show ' + type;
  fb.innerHTML = html;
}

/* =========================================================
   选项点击
   ========================================================= */
document.getElementById('steps').addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn || btn.disabled) return;
  handleChoose(+btn.dataset.step, +btn.dataset.opt);
});

function handleChoose(stepIdx, optIdx) {
  const q = questions[current];
  if (!q) return;
  const p = q.problem, st = q.state;
  if (stepIdx !== st.stepIdx || st.solved) return;
  const s = p.steps[stepIdx];

  if (optIdx === s.answer) {
    st.chosen[stepIdx] = optIdx;
    st.stepIdx++;
    st.expanded[stepIdx] = false;
    SFX.correct();
    addScore(10, false);
    incCombo();
    renderFacts(); renderSteps(); renderAnswer(); renderNav();
    if (st.stepIdx < p.steps.length) {
      requestAnimationFrame(() => {
        const nodes = document.querySelectorAll('#steps .step');
        const next = nodes[st.stepIdx];
        if (next) {
          const y = next.getBoundingClientRect().top + window.scrollY - 110;
          window.scrollTo({ top: y, behavior: 'smooth' });
        }
      });
    } else {
      requestAnimationFrame(() => {
        const input = $('ansInput');
        if (input) {
          input.focus({ preventScroll: true });
          const y = input.getBoundingClientRect().top + window.scrollY - 220;
          window.scrollTo({ top: y, behavior: 'smooth' });
        }
      });
    }
  } else {
    if (st.tried[stepIdx].indexOf(optIdx) < 0) st.tried[stepIdx].push(optIdx);
    st.hadWrong = true;
    resetCombo();
    SFX.wrong();
    /* 先让反馈活下来，再重建选项（同帧内重建会看不到红色反馈） */
    renderSteps();
    if (st.tried[stepIdx].length === 1) {
      addWrongRecord(q, {
        stepIdx: stepIdx + 1,
        stepQ: s.q,
        wrongChoice: LETTER[optIdx] + '. ' + s.options[optIdx],
        correctChoice: LETTER[s.answer] + '. ' + s.options[s.answer]
      });
    }
  }
}

/* =========================================================
   检查最终答案
   ========================================================= */
/* 答对 / 答错：把结果结算到分、连对、历史、错题本 */
function finalizeCorrect(q) {
  const p = q.problem, st = q.state;
  const shown = `${p.answer}${p.unit ? ' ' + p.unit : ''}`;
  st.solved = true;
  st.timeUsed = timerEnabled ? (TIME_LIMIT - timerRemaining) : 0;
  stopTimer();
  $('timerBar').style.display = 'none';
  showFb('ok', `✔ 完全正确！答案是 <b>${shown}</b>。<br><span class="fb-sub">${p.praise}</span>`);
  addScore(30, false);
  incCombo();
  doneCount++;
  renderGoal();
  if (!st.hadWrong) {
    incPerfect();
    addScore(20, true);
    SFX.perfect();
    floatScore('完美通关', true);
  } else {
    SFX.success();
  }
  if (!st.recorded) {
    st.recorded = true;
    addHistoryRecord(q, scoreVisible ? (st.hadWrong ? 30 : 50) : 0, !st.hadWrong, st.timeUsed);
  }
  /* 错题重做答对了 → 把这道题从错题本里移出去 */
  if (redoActive() && !redoState.done) {
    redoState.done = true;
    if (redoState.id) {
      const had = wrongBook.some(r => r.id === redoState.id);
      wrongBook = wrongBook.filter(r => r.id !== redoState.id);
      LS.set('wrongBook', wrongBook);
      renderWrongBadge();
      if (had) setTimeout(() => toastMsg('🎉 这道错题已经移出错题本！'), 420);
    } else {
      setTimeout(() => toastMsg('🎉 同类题做对了，继续加油！'), 420);
    }
  }
  mountNext();
  renderNav();
  requestAnimationFrame(() => {
    const b = $('nextBig');
    if (!b) return;
    const y = b.getBoundingClientRect().top + window.scrollY - 280;
    window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
  });
}

function finalizeWrong(q, raw) {
  const p = q.problem, st = q.state;
  st.hadWrong = true;
  resetCombo();
  SFX.wrong();
  showFb('no', `✘ 还差一点，再想一想。<br><span class="fb-sub">${p.wrongTip}</span>`);
  if (!st.wrongAnswerRecorded) {
    st.wrongAnswerRecorded = true;
    addWrongRecord(q, {
      stepIdx: 'answer',
      stepQ: '最终答案',
      wrongChoice: raw,
      correctChoice: `${p.answer}${p.unit ? ' ' + p.unit : ''}`
    });
  }
}

function check() {
  const q = questions[current];
  if (!q) return;
  const p = q.problem, st = q.state;
  if (st.solved) return;
  const raw = $('ansInput').value.trim();

  if (raw === '') { showFb('warn', '先算一算，把结果写在框里吧～'); return; }
  const num = Number(raw);
  if (isNaN(num)) { showFb('warn', '请输入一个数字哦。'); return; }

  if (Math.abs(num - p.answer) < 1e-6) {
    $('ansInput').disabled = true;
    finalizeCorrect(q);
  } else {
    finalizeWrong(q, raw);
  }
}

/* =========================================================
   错题重做
   只做错的那一道（原样重现，连引导步骤和选项顺序都一样），
   做对了就把它从错题本里移出去。
   ========================================================= */
let redoState = null;                  /* { id, kp, done } */
function redoActive() { return !!redoState; }

function startRedo(id) {
  const rec = wrongBook.find(r => r.id === id);
  if (!rec || !rec.problem) return;      /* 旧记录已在启动时清掉，这里兜个底 */
  redoState = { id: rec.id, kp: rec.kp, done: false };
  questions = [{
    tpl: { kp: rec.kp || '错题重做', unit: rec.topic || '' },
    problem: rec.problem,
    state: makeState(rec.problem)
  }];
  current = 0;
  gotoPractice();
}
function gotoPractice() {
  const btn = document.querySelector('.tab-btn[data-tab="practice"]');
  if (btn) btn.click();
  syncUnitUI();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function exitRedo() {
  redoState = null;
  buildSession();
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderWrongBook() {
  const list = $('wrongList');

      </div>
      <div class="record-line right-line">
        <span class="lbl">✔ 正确思路：</span>
        <span>${r.wrongStep === 'answer' ? '答案 ' + r.correctChoice : stepLabel + ' · ' + r.correctChoice}</span>
      </div>

        <button class="redo" data-redo="${r.id}">🔁 重做这道题</button>

/* 破坏性操作要「点两次」：第一次只是上膛，5 秒内不确认自动复原 */
function armConfirm(btn, action) {
  if (!btn) return;
  if (btn.dataset.armed === '1') { disarmConfirm(btn); action(); return; }
  btn.dataset.armed = '1';
  btn.dataset.label = btn.textContent;
  btn.classList.add('arming');
  btn.textContent = '⚠️ 再点一次';
  clearTimeout(btn._armTimer);
  btn._armTimer = setTimeout(() => disarmConfirm(btn), 5000);
}
function disarmConfirm(btn) {
  if (!btn || btn.dataset.armed !== '1') return;
  btn.dataset.armed = '0';
  btn.classList.remove('arming');
  btn.textContent = btn.dataset.label || '';
  clearTimeout(btn._armTimer);
}
