/* =========================================================
   PK：同题竞速
   一道题同时发给所有人，各人在自己的格子里点 ABCD，比谁又快又对。
   PK 里不再一步步引导——那是单人模式的活；这里条件一次全给。
   ========================================================= */
const PK_MAX = 4;
const PK_ROUNDS = 5;                 /* 一局共几题（所有人做同一道题） */
const PK_COLORS = ['#6B4CE6', '#FF6B9D', '#2ED573', '#FFA751'];
let PK_LIMIT = 60;                   /* 每题限时（秒） */
let pkMode = false;
let pkRound = 0;                     /* 已完成的题数 */
let pkRace = null;                   /* 当前这一题的竞速状态 */
let pkRenderedCount = -1;
let pkPlayers = [
  { name: '玩家1', score: 0, correct: 0, fast: 0 },
  { name: '玩家2', score: 0, correct: 0, fast: 0 }
];
function pkNewPlayer() {
  return { name: '玩家' + (pkPlayers.length + 1), score: 0, correct: 0, fast: 0 };
}
function pkResetStats() {
  pkPlayers.forEach(p => { p.score = 0; p.correct = 0; p.fast = 0; });
  pkRound = 0;
}
/* 本题正在作答中：不许加人减人改限时，否则每人一格的索引会错位 */
function pkRaceLive() { return !!pkRace && pkRace.live && !pkRace.resolved; }
/* 本题还没收官（含倒计时）：这种时候也不许改人数 */
function pkRaceBusy() { return !!pkRace && !pkRace.resolved; }

/* 同一个元素要重放同一个动画，必须先摘类、强制重排一次，否则不会重播 */
function replayAnim(el, cls) {
  if (!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
}

/* 一题的 4 个候选答案：正确答案 + 3 个像样的干扰项，生成一次就固定 */
function buildPkOptions(problem) {
  const correct = String(problem.answer);
  const wrongs = numWrongs(problem.answer, []).map(String);
  const pool = shuffleAll([correct, ...wrongs.slice(0, 3)]);
  return { options: pool, answer: pool.indexOf(correct) };
}
/* ---------- 玩家格（每人一格，只放 ABCD 四个键） ---------- */
function buildPkPads() {
  const wrap = $('pkPads');
  if (!wrap) return;
  wrap.innerHTML = pkPlayers.map((p, i) => `
    <div class="pk-pad" id="pkPad${i}" data-idx="${i}" style="--pk:${PK_COLORS[i % PK_COLORS.length]}">
      <div class="pk-pad-head">
        <span class="pk-name" data-rename="${i}" title="点一下可以改名">${p.name}</span>
        <span class="pk-score" id="pkPadScore${i}">${p.score}<span class="pk-unit">分</span></span>
        ${pkPlayers.length > 2 ? `<button class="pk-del" data-del="${i}" title="移除这位玩家" aria-label="移除这位玩家">✕</button>` : ''}
      </div>
      <div class="pk-keys">
        ${LETTER.split('').map((L, k) =>
          `<button class="pk-key" data-p="${i}" data-k="${k}" aria-label="${p.name} 选 ${L}">${L}</button>`).join('')}
      </div>
      <div class="pk-status" id="pkPadStatus${i}">准备…</div>
    </div>`).join('');
  pkRenderedCount = pkPlayers.length;
  wrap.querySelectorAll('.pk-key').forEach(b => {
    b.addEventListener('click', () => pkAnswer(+b.dataset.p, +b.dataset.k));
  });
  wrap.querySelectorAll('[data-del]').forEach(b => {
    b.addEventListener('click', () => removePkPlayer(+b.dataset.del));
  });
  wrap.querySelectorAll('[data-rename]').forEach(el => {
    el.addEventListener('click', () => renamePkPlayer(+el.dataset.rename));
  });
  pkSetKeysEnabled(false);
}
function pkSetKeysEnabled(on) {
  document.querySelectorAll('#pkPads .pk-key').forEach(b => {
    if (!on) { b.disabled = true; return; }
    if (b.classList.contains('chosen-ok') || b.classList.contains('chosen-no')) return;
    b.disabled = false;
  });
}
/* 新的一题：把上一题留在按键上的对错痕迹清掉 */
function pkResetPads() {
  document.querySelectorAll('#pkPads .pk-key').forEach(b => {
    b.classList.remove('chosen-ok', 'chosen-no');
    b.disabled = true;
  });
}
function renamePkPlayer(i) {
  if (!pkPlayers[i] || pkRaceBusy()) return;
  const v = window.prompt('给这位玩家改个名字（最多 6 个字）：', pkPlayers[i].name);
  if (v === null) return;
  const s = v.trim().slice(0, 6);
  if (!s) return;
  pkPlayers[i].name = s;
  const pad = $('pkPad' + i);
  if (pad) { const el = pad.querySelector('.pk-name'); if (el) el.textContent = s; }
  SFX.click();
}
function addPkPlayer() {
  if (pkPlayers.length >= PK_MAX || pkRaceBusy()) return;
  pkPlayers.push(pkNewPlayer());
  if (pkRace) pkRace.done.push(null);          /* 新玩家的作答位跟着补一个 */
  buildPkPads();
  renderPkBar();
  renderPkStatus();
  if (pkRace && pkRace.resolved) renderPkResult();
  SFX.click();
}
function removePkPlayer(i) {
  if (pkPlayers.length <= 2 || pkRaceBusy()) return;
  pkPlayers.splice(i, 1);
  pkPlayers.forEach((p, k) => { if (/^玩家\d+$/.test(p.name)) p.name = '玩家' + (k + 1); });
  if (pkRace) pkRace.done.splice(i, 1);        /* 对位删掉，别把别人的成绩错位 */
  buildPkPads();
  renderPkBar();
  renderPkStatus();
  if (pkRace && pkRace.resolved) renderPkResult();
  SFX.click();
}

/* ---------- 竞速核心 ---------- */
function pkStartRound() {
  const pool = poolTemplates();
  if (pool.length === 0) return;
  const q = newQuestion(nextTemplate(pool));
  questions.push(q);
  current = questions.length - 1;
  if (pkRace && pkRace.tick) clearInterval(pkRace.tick);
  pkRace = {
    q,
    opts: buildPkOptions(q.problem),
    startedAt: 0,
    endsAt: 0,
    done: pkPlayers.map(() => null),   /* null=还没按；{ok,ms,key}=已按 */
    fastest: -1,
    live: false,
    resolved: false,
    tick: null
  };
  const box = $('pkResult');
  if (box) { box.classList.remove('on'); box.innerHTML = ''; }
  render();
  pkResetPads();
  pkCountdown();
}
/* 3-2-1：所有人同时看到题目、同时开始计时，才谈得上比快 */
function pkCountdown() {
  let n = 3;
  const step = () => {
    if (!pkRace || pkRace.resolved) return;
    if (n > 0) { pkToastMsg(String(n)); n--; setTimeout(step, 650); return; }
    pkToastMsg('开始！');
    pkRace.live = true;
    pkRace.startedAt = Date.now();
    pkRace.endsAt = pkRace.startedAt + PK_LIMIT * 1000;
    pkSetKeysEnabled(true);
    updatePkTimer(PK_LIMIT * 1000);
    renderPkStatus();
    pkRace.tick = setInterval(pkTick, 120);
  };
  step();
}
function pkTick() {
  if (!pkRace || pkRace.resolved) return;
  const left = Math.max(0, pkRace.endsAt - Date.now());
  updatePkTimer(left);
  if (left <= 0) pkResolve();
}
function updatePkTimer(leftMs) {
  const fill = $('pkRaceFill'), txt = $('pkRaceText'), bar = $('pkRaceTimer');
  if (!fill || !txt) return;
  fill.style.width = Math.max(0, Math.min(100, leftMs / (PK_LIMIT * 1000) * 100)) + '%';
  txt.textContent = Math.ceil(leftMs / 1000) + 's';
  if (bar) bar.classList.toggle('urgent', leftMs <= 10000);
}
function pkAnswer(pi, keyIdx) {
  if (!pkRace || !pkRace.live || pkRace.resolved) return;
  if (pkRace.done[pi]) return;                     /* 每人每题只有一次机会，按下就定 */
  const ok = keyIdx === pkRace.opts.answer;
  pkRace.done[pi] = { ok, ms: Date.now() - pkRace.startedAt, key: keyIdx };
  /* 反馈必须先落在这一帧上，再谈别的 */
  const pad = $('pkPad' + pi);
  if (pad) {
    replayAnim(pad, ok ? 'correct-flash' : 'wrong-flash');
    setTimeout(() => pad.classList.remove('correct-flash', 'wrong-flash'), 640);
  }
  const btn = document.querySelector(`.pk-key[data-p="${pi}"][data-k="${keyIdx}"]`);
  if (btn) { btn.classList.remove('chosen-ok', 'chosen-no'); btn.classList.add(ok ? 'chosen-ok' : 'chosen-no'); }
  document.querySelectorAll(`.pk-key[data-p="${pi}"]`).forEach(b => { b.disabled = true; });
  if (ok) SFX.correct(); else SFX.wrong();
  renderPkStatus();
  if (pkRace.done.every(d => d)) pkResolve();      /* 都按完了，立刻收官，不用等满 */
}
function pkResolve() {
  if (!pkRace || pkRace.resolved) return;
  pkRace.resolved = true;
  if (pkRace.tick) { clearInterval(pkRace.tick); pkRace.tick = null; }
  pkRound++;
  const correctOnes = pkRace.done
    .map((d, i) => (d && d.ok ? { i, ms: d.ms } : null))
    .filter(Boolean).sort((a, b) => a.ms - b.ms);
  const fastest = correctOnes.length ? correctOnes[0].i : -1;
  pkRace.fastest = fastest;
  pkPlayers.forEach((p, i) => {
    const d = pkRace.done[i];
    if (!d || !d.ok) return;
    p.correct += 1;
    p.score += (i === fastest) ? 3 : 2;             /* 答对 2 分，最快再 +1 */
    if (i === fastest) p.fast += 1;
  });
  renderPkBar();
  renderPkStatus();
  renderPkResult();
  if (correctOnes.length) SFX.levelup(); else SFX.timeout();
}
function renderPkResult() {
  const box = $('pkResult');
  if (!box || !pkRace) return;
  const fastest = pkRace.fastest;
  const p = pkRace.q.problem, o = pkRace.opts;
  const rows = pkPlayers.map((pl, i) => {
    const d = pkRace.done[i];
    let t = '未作答', cls = 'miss';
    if (d && d.ok) { t = (d.ms / 1000).toFixed(1) + ' 秒'; cls = (i === fastest) ? 'fast' : 'hit'; }
    else if (d) { t = '答错'; }
    return `<div class="pk-res-row ${cls}">
        <span class="pk-res-name">${pl.name}</span>
        <span class="pk-res-time">${i === fastest ? '⚡ ' : ''}${t}</span>
      </div>`;
  }).join('');
  box.innerHTML = `
    <div class="pk-res-head">
      <span>本题答案：<b>${LETTER[o.answer]}. ${o.options[o.answer]}${p.unit ? ' ' + p.unit : ''}</b></span>
      <span class="pk-res-tip">${fastest >= 0 ? '⚡ ' + pkPlayers[fastest].name + ' 最快' : '本题没人答对'}</span>
    </div>
    <div class="pk-res-rows">${rows}</div>
    <div class="pk-res-note">💡 ${p.wrongTip}</div>
    <div class="next-wrap">${nextBtnHtml().html}</div>`;
  box.classList.add('on');
  const b = $('nextBig');
  if (b) b.addEventListener('click', pkNextRound);
}
function pkNextRound() {
  SFX.click();
  if (pkRound >= PK_ROUNDS) { openPkResult(); return; }
  pkStartRound();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function renderPkRace() {
  const race = $('pkRace'), solo = $('soloFlow');
  if (!race || !solo) return;
  if (!pkMode) { race.style.display = 'none'; solo.style.display = ''; return; }
  solo.style.display = 'none';
  race.style.display = 'block';
  if (pkRenderedCount !== pkPlayers.length) buildPkPads();
  if (!pkRace) return;
  const o = pkRace.opts, p = pkRace.q.problem;
  const box = $('pkOpts');
  if (box) box.innerHTML = o.options.map((t, i) =>
    `<div class="pk-opt"><span class="pk-opt-key">${LETTER[i]}</span>
      <span class="pk-opt-text">${t}${p.unit ? `<span class="ans-unit">${p.unit}</span>` : ''}</span></div>`
  ).join('');
  renderPkStatus();
}
function renderPkBar() {
  if (!pkMode) return;
  const addBtn = $('pkAddPlayer');
  if (addBtn) {
    const full = pkPlayers.length >= PK_MAX, busy = pkRaceBusy();
    addBtn.disabled = full || busy;
    addBtn.textContent = full ? '已满 4 人' : busy ? '本题进行中…' : '➕ 添加玩家';
  }
  const qn = $('pkQNo'), qt = $('pkQTotal');
  if (qn) qn.textContent = Math.min(pkRound + 1, PK_ROUNDS);
  if (qt) qt.textContent = PK_ROUNDS;
  document.querySelectorAll('.pk-limit-btn').forEach(b => {
    b.disabled = pkRaceBusy();
    b.classList.toggle('on', +b.dataset.limit === PK_LIMIT);
  });
}
function renderPkStatus() {
  pkPlayers.forEach((p, i) => {
    const st = $('pkPadStatus' + i), sc = $('pkPadScore' + i);
    if (sc) sc.innerHTML = p.score + '<span class="pk-unit">分</span>';
    if (!st) return;
    const d = pkRace && pkRace.done[i];
    if (!d) {
      const waiting = pkRace && !pkRace.live && !pkRace.resolved;
      st.textContent = waiting ? '准备…'
        : (pkRace && pkRace.resolved ? '未作答' : '作答中…');
      st.className = 'pk-status';
    } else if (d.ok) {
      st.textContent = (d.ms / 1000).toFixed(1) + ' 秒 ✓';
      st.className = 'pk-status ok';
    } else {
      st.textContent = '答错了 ✗';
      st.className = 'pk-status no';
    }
  });
}
function pkToastMsg(text) {
  const t = $('pkToast');
  if (!t) return;
  t.textContent = text;
  t.classList.add('on');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('on'), 1400);
}
function closePkResult() {
  const m = $('pkModal');
  if (m) m.classList.remove('on');
}
function setPkMode(on) {
  pkMode = on;
  document.body.dataset.pk = on ? '1' : '0';   /* 桌面/一体机据此切成宽屏布局 */
  $('pkToggle').classList.toggle('on', on);
  $('pkToggle').textContent = on ? '🎮 PK' : '🎮';
  $('pkBar').classList.toggle('on', on);
  $('goalBar').style.display = on ? 'none' : (selectedUnits.length ? 'block' : 'none');
  closePkResult();
  /* 清掉上一局的残留 */
  if (pkRace && pkRace.tick) clearInterval(pkRace.tick);
  pkRace = null;
  questions = []; tplQueue = []; current = 0;
  const box = $('pkResult');
  if (box) { box.classList.remove('on'); box.innerHTML = ''; }
  /* 单人区也要清空：否则 #nextBig 会在隐藏的引导区里留一个，出现重复 id */
  const ai = $('answerInner'); if (ai) ai.innerHTML = '';
  const stEl = $('steps'); if (stEl) stEl.innerHTML = '';
  pkResetStats();
  if (on) {
    syncUnitUI();
    if (poolTemplates().length === 0) { renderPkRace(); renderPkBar(); return; }
    SFX.levelup();
    pkStartRound();
  } else {
    buildSession();
    renderAll();
  }
}
function openPkResult() {
  const MEDALS = ['🥇', '🥈', '🥉', '4️⃣'];
  const sorted = pkPlayers.slice().sort((a, b) => b.score - a.score || b.correct - a.correct);
  const tie = sorted.length > 1 && sorted[0].score === sorted[1].score;
  const rows = sorted.map((p, i) => `<div class="pk-rank-row${(!tie && i === 0) ? ' first' : ''}">
      <span class="pk-medal">${tie && i < 2 ? '🤝' : (MEDALS[i] || (i + 1))}</span>
      <span>第 ${i + 1} 名 · ${p.name}<span class="pk-rd"> · 答对 ${p.correct} 题 · 最快 ${p.fast} 次</span></span>
      <span class="pk-rs">${p.score}<span style="font-size:12px;">分</span></span>
    </div>`).join('');
  $('pkModalCard').innerHTML = `
    <h2>🏆 对局结束</h2>
    <div class="pk-win">${tie ? '分数打平，并列第一！' : sorted[0].name + ' 获胜！'}</div>
    <div class="pk-rank">${rows}</div>
    <div class="pk-modal-actions">
      <button class="pk-again" id="pkAgain">🔁 再来一局</button>
      <button class="pk-exit" id="pkExit">退出 PK</button>
    </div>`;
  $('pkModal').classList.add('on');
  SFX.perfect();
  $('pkAgain').addEventListener('click', () => { SFX.click(); setPkMode(true); });
  $('pkExit').addEventListener('click', () => { SFX.click(); setPkMode(false); });
}

$('pkToggle').addEventListener('click', () => { SFX.click(); setPkMode(!pkMode); });
$('pkAddPlayer').addEventListener('click', addPkPlayer);
document.querySelectorAll('.pk-limit-btn').forEach(b => {
  b.addEventListener('click', () => {
    if (pkRaceBusy()) return;
    PK_LIMIT = +b.dataset.limit;    renderPkBar();
    updatePkTimer(PK_LIMIT * 1000);
    SFX.click();
  });
});

/* =========================================================
   启动
   ========================================================= */
loadUnits();
renderUnitChips();
buildSession();
renderAll();
renderWrongBadge();

</script>
</body>
